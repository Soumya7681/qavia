openapi: 3.1.0

# This file is the contract, and it is written before the handler.
#
# oapi-codegen generates the Go server interface, the request and response types,
# and a kin-openapi validator middleware from it. An endpoint that does not match
# the spec does not compile. openapi-typescript generates the browser client from
# the same file, so the web app hand-writes no request or response type
# (tech-stack.md 11).
#
# Conventions, applied everywhere and not restated per path:
#   - Versioned prefix from day one: /api/v1. Adding versioning later means
#     touching every route.
#   - REST, plural nouns, nested where ownership is real.
#   - Cursor pagination on every list: ?limit=&cursor=, response carries
#     nextCursor. Offset pagination breaks under concurrent writes.
#   - Long operations return 202 with a job ID, never block. NFR-1 requires a
#     response inside 500 ms.
#   - Errors always use the Error envelope. Codes are catalogued in
#     docs/error-codes.md and the frontend branches on code, never on message.
#   - A secret reads back as SecretRead. The API never returns a stored secret.

info:
  title: Qavia API
  version: 0.1.0
  description: |
    Internal Hyscaler platform that acts as an AI QA engineer.

    Every mutation goes through this API. The web app holds no database
    credentials and no queue access, so this is the single place authorisation is
    enforced.
  contact:
    name: Hyscaler
    email: max@hyscaler.com

servers:
  - url: /
    description: Same origin as the API process

tags:
  - name: health
    description: Liveness and readiness. Unauthenticated, and outside the versioned prefix.
  - name: auth
    description: |
      Local email and password. Sessions are server-side, so revocation is
      immediate. There is no self-registration: an admin invites a user and the
      user sets their own password from the invitation link.
  - name: users
    description: User administration. Admin only, except for reading your own profile.
  - name: settings
    description: |
      The platform is configured here, not from environment files. Only the six
      bootstrap variables in requirements.md 5.1 live outside this API.

      The registry endpoint is the contract for the whole settings screen: it
      carries every setting's type, validation as JSON Schema, scope, and minimum
      role, so the UI renders from it and cannot drift from the server.
  - name: setup
    description: |
      First-run setup. Unauthenticated, because it runs before an account exists,
      and the admin endpoint stops existing the moment one does.
  - name: projects
    description: |
      A project is the unit of ownership: inputs, generated suites, runs and
      defects all hang off one. Archiving is a soft delete, because history is a
      requirement.
  - name: artifacts
    description: |
      Uploaded or connected inputs. Content-addressed by SHA-256, so an identical
      re-upload does not re-run generation and a changed file becomes a new
      version with the old one intact.
  - name: jobs
    description: |
      Everything long-running is a job chain. Submitting returns immediately with
      a job reference; the user may close the browser and be notified when it
      finishes.
  - name: notifications
    description: |
      The in-app notification centre. Built in, always available, and never
      blocked by an unconfigured email or Slack channel.
  - name: audit
    description: Privileged actions, admin only. No row here holds a secret.
  - name: generation
    description: |
      Ingest and generation. Parsing is deterministic code; extraction and design
      are agent stages. Everything produced cites the source it came from.
  - name: ai
    description: |
      The AI provider layer. Providers, models, tier assignments, budget, and
      spend. An agent asks for a tier and never for a model, which is what keeps
      switching provider a settings change rather than a deploy.
  - name: triggers
    description: |
      Ways a run starts without a browser. The built-in webhook needs no external
      platform configured.

security:
  - sessionCookie: []

paths:
  /healthz:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Liveness
      description: |
        Reports that the process is running. It deliberately touches no
        dependency: a liveness probe that fails because Postgres is briefly
        unreachable causes a restart loop instead of reporting a degraded
        dependency.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
              example:
                status: ok
                version: 0.1.0

  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness
      description: |
        Checks every dependency the process needs to serve traffic: the database,
        the queue, and the configured object store. Returns 503 with the failing
        check named when any is unreachable, so a deploy fails visibly rather than
        serving errors.
      security: []
      responses:
        "200":
          description: Every dependency is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ok
                checks:
                  - name: database
                    status: ok
                  - name: queue
                    status: ok
                  - name: object_store
                    status: ok
                    detail: "local-disk"
        "503":
          description: At least one dependency is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: unavailable
                checks:
                  - name: database
                    status: ok
                  - name: queue
                    status: failing
                    detail: "dial tcp 127.0.0.1:56379: connect: connection refused"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      description: |
        Creates a server-side session and sets the session cookie.

        A wrong password and an unknown account return exactly the same error.
        Distinguishing them tells an attacker which accounts exist.

        Repeated failures lock the account for a configured period. The lockout is
        durable, so a restart does not unlock it, and an admin can clear it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: max@hyscaler.com
              password: correct-horse-battery-staple
      responses:
        "200":
          description: Signed in. The session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Email or password is incorrect. Deliberately identical for an unknown account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invalid_credentials
                message: Email or password is incorrect.
        "403":
          description: The account is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: account_disabled
                message: This account is disabled. Ask an admin to re-enable it.
        "423":
          description: Locked after repeated failures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: account_locked
                message: Too many failed sign-in attempts. This account is locked temporarily.
                details:
                  retryAfterSeconds: 900
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      description: Destroys the session row, so the cookie is useless immediately.
      responses:
        "204":
          description: Signed out.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/accept-invite:
    post:
      operationId: acceptInvite
      tags: [auth]
      summary: Accept an invitation and set a password
      description: |
        Single use, and expires. The token is stored hashed, so a leaked database
        yields no working invitation links.

        Password rules come from the settings registry rather than being hardcoded
        in the client, so the message names the rule that failed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: Password set and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: The invitation is invalid or expired, or the password is too weak.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invite_invalid
                message: This invitation link is invalid or has expired. Ask an admin to send a new one.
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change your own password
      description: |
        Requires the current password. Every other session for this user is
        destroyed, because a password change is the one moment a user expects
        other devices to be signed out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed. Other sessions were destroyed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The signed-in user
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 3f9a2b41-6c7d-4e8f-9a1b-2c3d4e5f6a7b
                email: max@hyscaler.com
                name: Max
                role: admin
                timezone: Asia/Kolkata
                disabled: false
                createdAt: "2026-08-01T09:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/users/invite:
    post:
      operationId: inviteUser
      tags: [users]
      summary: Invite a user
      description: |
        Creates the user with no password and returns a single-use invitation link.

        The link is returned in the response and shown once, because email is an
        optional integration: on a zero-integration install there is no SMTP to
        send it, and the admin passes it on by whatever means they already use. If
        SMTP is configured the platform also sends it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
            example:
              email: newjoiner@hyscaler.com
              name: New Joiner
              role: qa_engineer
      responses:
        "201":
          description: Invited. The link is shown once and not retrievable later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An account with that email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: email_already_taken
                message: An account with that email already exists.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/users/{userID}/role:
    put:
      operationId: setUserRole
      tags: [users]
      summary: Change a user's role
      description: |
        An admin cannot change their own role. Locking the last admin out of their
        own instance is a support call nobody wants, and the check is cheap.

        Every session belonging to the user is rotated, so a role change takes
        effect on the next request rather than at the end of a session.
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: Role changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not an admin, or an attempt to change your own role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: cannot_change_own_role
                message: You cannot change your own role. Ask another admin.
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/users/{userID}/status:
    put:
      operationId: setUserStatus
      tags: [users]
      summary: Enable or disable a user
      description: |
        Disabling destroys every session the user holds, so access ends
        immediately rather than when a token would have expired.
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled:
                  type: boolean
      responses:
        "200":
          description: Status changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/users/{userID}/sessions:
    delete:
      operationId: revokeUserSessions
      tags: [users]
      summary: Sign a user out everywhere
      description: |
        Deletes every session row for the user. This is why sessions are
        server-side: an offboarded employee's access ends here, with no token TTL
        to wait out.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Sessions revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
                    description: How many sessions were destroyed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/users/{userID}/unlock:
    post:
      operationId: unlockUser
      tags: [users]
      summary: Clear a login lockout
      description: |
        Clears the lockout left by repeated failed sign-ins, without waiting for it
        to expire.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Lockout cleared, or there was none.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/settings/registry:
    get:
      operationId: getSettingsRegistry
      tags: [settings]
      summary: Every setting's declaration
      description: |
        The single source of truth for the settings UI. Each entry carries its type,
        default, validation as JSON Schema, the scopes it may be written at, its
        minimum role, and whether changing it needs a restart.

        A client renders forms from this and converts each schema to its own
        validator at runtime, so client-side and server-side validation come from
        one declaration. Adding a setting on the server therefore needs no frontend
        change at all.

        Entries above the caller's role are omitted, and the server enforces the
        same rule on write.
      responses:
        "200":
          description: Every setting the caller may see.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsRegistry"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Resolved setting values
      description: |
        Values resolved user, then project, then global, then the declared default.

        Each value reports which scope it came from, so the UI can show that a value
        is inherited and offer to reset an override. A secret reports only
        `{isSet, updatedAt, hint}`; the stored value is never returned.
      parameters:
        - name: projectID
          in: query
          required: false
          description: Resolve project-scoped values for this project.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resolved values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingValues"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

    put:
      operationId: updateSettings
      tags: [settings]
      summary: Write one or more settings
      description: |
        Each change is validated against its registry entry, checked against the
        caller's role and the scopes the setting allows, and written with an audit
        row in the same transaction.

        Writes are all-or-nothing per request: one invalid value rejects the whole
        request rather than leaving half the form applied.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
            example:
              changes:
                - key: runner.timeout_seconds
                  scope: global
                  value: 900
                - key: preferences.theme
                  scope: user
                  value: dark
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingValues"
        "400":
          description: A value failed its declared validation, or the key is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: setting_invalid_value
                message: Must be between 30 and 3600.
                details:
                  key: runner.timeout_seconds
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The caller's role is below the setting's minimum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: setting_role_too_low
                message: Changing "storage.provider" requires the Admin role.
                details:
                  key: storage.provider
                  requiredRole: Admin
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/settings/{key}:
    delete:
      operationId: clearSetting
      tags: [settings]
      summary: Remove an override
      description: |
        Deletes the stored value at one scope so the setting falls through to the
        next: user to project, project to global, global to the declared default.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
        - name: scope
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SettingScope"
        - name: projectID
          in: query
          required: false
          description: Required when clearing a project-scoped value.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Cleared, or there was no override to clear.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      tags: [setup]
      security: []
      summary: What first-run setup still needs
      description: |
        Public, because it is read before an account exists. It reports what is
        missing rather than a single boolean, so the wizard can show the remaining
        steps: no admin, storage unreachable, no AI provider.

        Only the admin and reachable storage block completion. A missing AI
        provider is reported as required before AI jobs can run, which is enforced
        at enqueue time rather than by refusing setup.
      responses:
        "200":
          description: The current setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
              example:
                complete: true
                adminExists: true
                storageReachable: true
                storageProvider: local-disk
                storageDetail: Writable at /var/lib/qavia/storage
                aiProviderConfigured: true
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/setup/admin:
    post:
      operationId: createFirstAdmin
      tags: [setup]
      security: []
      summary: Create the first admin
      description: |
        Available only while zero users exist, and permanently 404 afterwards, so
        it cannot become a back door once the platform is in use. Rate limited by
        address.

        This is what makes the six bootstrap variables enough to reach a working
        logged-in admin with no seed script and no manual SQL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminRequest"
            example:
              email: max@hyscaler.com
              name: Max
              password: correct-horse-battery-staple
      responses:
        "201":
          description: Admin created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Setup is already complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: setup_already_complete
                message: Setup is already complete.
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      description: |
        A QA Engineer sees the projects they own or are a member of. A QA Lead and
        an Admin see all of them. The difference is applied server-side, because a
        client-side filter is not an access control.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: includeArchived
          in: query
          required: false
          description: Archived projects are hidden by default. They stay readable, and read-only.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      description: |
        The creator becomes the owner, and ownership counts as membership, so
        nobody has to add themselves to their own project.

        Test types are chosen here and editable later. A type that is not
        implemented yet is accepted and returned with `available: false` and a
        reason, so the UI disables it rather than hiding it (F-3.12).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              name: QuickDesk
              description: Support desk API
              testTypes: [test_cases, api_tests]
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}:
    get:
      operationId: getProject
      tags: [projects]
      summary: One project
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      operationId: updateProject
      tags: [projects]
      summary: Rename a project or change its test types
      description: |
        An archived project is read-only: this returns `project_archived` rather
        than silently succeeding or failing with a 500.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/archive:
    post:
      operationId: archiveProject
      tags: [projects]
      summary: Archive a project
      description: |
        A soft delete, because history is a requirement here: runs, defects and
        generated suites stay readable. Everything that mutates the project is
        refused while it is archived.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Archived, or already archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/unarchive:
    post:
      operationId: unarchiveProject
      tags: [projects]
      summary: Restore an archived project
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Restored, or never archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/external-ai-approval:
    put:
      operationId: setExternalAIApproval
      tags: [projects]
      summary: Approve or revoke external AI processing for a project
      description: |
        The server-side gate for data residency (F-16.13). Without approval a
        project may only be assigned providers marked local, and that is checked
        before an AI job is enqueued rather than inside a worker.

        Admin only, and audited.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
                note:
                  type: string
                  maxLength: 500
                  description: Recorded in the audit row, for example the contract reference.
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/members:
    get:
      operationId: listProjectMembers
      tags: [projects]
      summary: Project members
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Every member, plus the owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/members/{userID}:
    put:
      operationId: addProjectMember
      tags: [projects]
      summary: Add a member or change their project role
      description: |
        The project role is separate from the platform role: a QA Engineer may lead
        one project and only contribute to another. The narrower of the two applies.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: Added or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      operationId: removeProjectMember
      tags: [projects]
      summary: Remove a member
      description: |
        The owner cannot be removed. Transfer ownership first, otherwise a project
        ends up with nobody who can administer it.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Removed, or was not a member.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/artifacts:
    get:
      operationId: listArtifacts
      tags: [artifacts]
      summary: List a project's inputs
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ArtifactKind"
      responses:
        "200":
          description: A page of artifacts, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      operationId: uploadArtifact
      tags: [artifacts]
      summary: Upload an input file
      description: |
        Multipart, streamed to the object store: the file is never buffered whole
        in memory, and the SHA-256 is computed while streaming.

        Checks run in this order, before anything is written: the size cap, the
        content-type allowlist matched against the sniffed type rather than the
        extension, then archive-bomb rejection.

        Re-uploading an identical file returns the existing artifact with
        `deduplicated: true` and does not re-run generation (FR-1.4). A changed
        file with the same name and kind becomes version 2, and version 1 stays,
        which is what the maintenance module diffs against.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  $ref: "#/components/schemas/ArtifactKind"
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: Larger than the configured upload limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: upload_too_large
                message: That file is larger than the 50 MB upload limit.
                details:
                  limitBytes: 52428800
        "415":
          description: The sniffed content type is not on the allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unsupported_media_type
                message: Files of type "application/x-msdownload" are not accepted.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/artifacts/{artifactID}:
    get:
      operationId: getArtifact
      tags: [artifacts]
      summary: One artifact
      parameters:
        - $ref: "#/components/parameters/ArtifactID"
      responses:
        "200":
          description: The artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      operationId: deleteArtifact
      tags: [artifacts]
      summary: Delete an artifact
      description: The stored object is removed with the row, so nothing is orphaned.
      parameters:
        - $ref: "#/components/parameters/ArtifactID"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/artifacts/{artifactID}/versions:
    get:
      operationId: listArtifactVersions
      tags: [artifacts]
      summary: Every version of one logical input
      description: |
        Versions share a lineage. This is the history a spec change is diffed
        against in phase 11.
      parameters:
        - $ref: "#/components/parameters/ArtifactID"
      responses:
        "200":
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artifact"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/artifacts/{artifactID}/content:
    get:
      operationId: downloadArtifact
      tags: [artifacts]
      summary: Download the stored file
      description: |
        Streamed from the object store. A driver that can sign URLs redirects
        instead, so a large download does not pass through the API process.
      parameters:
        - $ref: "#/components/parameters/ArtifactID"
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: A signed URL at the object store.
          headers:
            Location:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: A project's jobs
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of jobs, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      operationId: submitJob
      tags: [jobs]
      summary: Submit a job chain
      description: |
        Returns 202 with a job reference and never blocks: the user may close the
        browser and be notified when the chain finishes (FR-1.6, NFR-1).

        Everything checkable is checked here rather than inside a worker twenty
        minutes later: the project is not archived, the chain exists, an AI chain
        has a configured provider, and the project is approved for external AI if
        the assigned provider is not local.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitJobRequest"
            example:
              chain: noop
      responses:
        "202":
          description: Accepted. Subscribe to the job rather than waiting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/jobs/{jobID}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: One job, with its chain
      description: |
        A chain is queryable as a unit: the parent job carries its stages, so one
        request describes the whole submission rather than one stage of it.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/jobs/{jobID}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a job
      description: |
        Cancellation is cooperative: the handler's context is cancelled and it
        stops between units of work, so nothing is killed mid-write. A job that has
        already finished returns `job_not_cancelable`.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: job_not_cancelable
                message: This job is succeeded and can no longer be cancelled.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/jobs/{jobID}/events:
    get:
      operationId: streamJobEvents
      tags: [jobs]
      summary: Live job status and event log
      description: |
        Server-sent events. The current state is sent on connect and then deltas,
        so a late joiner is never left with a blank screen.

        A comment heartbeat every 15 seconds keeps proxies from closing an idle
        stream. `Last-Event-ID` resumes after a reconnect from the last event the
        client saw, so a dropped connection does not leave a gap in the log.

        Fan-out is one database listener per process serving many browsers, never
        one connection per viewer.
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event received. Sent automatically by an EventSource on reconnect.
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: An event stream of `status` and `event` messages.
          content:
            text/event-stream:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: The notification centre
      description: |
        The in-app channel is built in, always available, and needs no
        configuration, so this endpoint works on an install with no SMTP and no
        Slack (FR-8.2). Every notification carries a deep link to what it is about
        (FR-8.5).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of notifications, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Unread badge count
      responses:
        "200":
          description: How many are unread.
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties:
                  unread:
                    type: integer
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark everything read
      responses:
        "200":
          description: How many were marked.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/notifications/{notificationID}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one read
      parameters:
        - name: notificationID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Marked, or already read.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/audit:
    get:
      operationId: listAuditEntries
      tags: [audit]
      summary: The audit log
      description: |
        Admin only, cursor paginated, and filterable. No row here contains a
        secret: detail passes through the same redaction as the logger.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: action
          in: query
          required: false
          description: Exact action name, for example setting_changed.
          schema:
            type: string
            maxLength: 100
        - name: actorID
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: projectID
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of audit entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/hooks/{token}:
    post:
      operationId: triggerWebhook
      tags: [triggers]
      security: []
      summary: Inbound trigger webhook
      description: |
        The built-in RunTrigger, so a CI system can start work with no external
        platform configured and no user session.

        The token identifies the project. The body is authenticated by an HMAC
        signature over the raw bytes in `X-Qavia-Signature`, and a replayed
        signature is refused, so a captured request cannot be resent. A bad
        signature is audited.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
        - name: X-Qavia-Signature
          in: header
          required: true
          description: "Hex-encoded HMAC-SHA256 of the raw body, prefixed with sha256=."
          schema:
            type: string
            maxLength: 128
        - name: X-Qavia-Timestamp
          in: header
          required: true
          description: Unix seconds. A request outside the tolerance window is refused.
          schema:
            type: string
            maxLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookTriggerRequest"
            example:
              chain: noop
              reference: refs/heads/main
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: The signature is missing, wrong, stale, or replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: webhook_signature_invalid
                message: The webhook signature is not valid for this body.
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/ai/providers:
    get:
      operationId: listAIProviders
      tags: [ai]
      summary: Configured AI providers
      description: |
        Credentials read back as `{isSet, updatedAt, hint}` and never as a value:
        a stored secret is replaced, not edited (F-1.8).
      responses:
        "200":
          description: Every provider, default first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProviderList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      operationId: createAIProvider
      tags: [ai]
      summary: Add a provider
      description: |
        One adapter kind, `openai-compatible`, reaches Ollama, vLLM, LiteLLM,
        OpenRouter, Together, Groq, Fireworks and DeepSeek: a base URL, an optional
        key, and a model name, with no code change and no deploy.

        `dataResidency` is the server-side half of the NDA problem. A project
        without external AI approval may only be assigned a provider marked
        `local`, and that is enforced before any job is enqueued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAIProviderRequest"
            example:
              name: Local Qwen
              kind: openai-compatible
              dataResidency: local
              credentials:
                base_url: http://localhost:11434/v1
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProvider"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/ai/providers/{providerID}:
    get:
      operationId: getAIProvider
      tags: [ai]
      summary: One provider
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      responses:
        "200":
          description: The provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProvider"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    put:
      operationId: updateAIProvider
      tags: [ai]
      summary: Update a provider
      description: |
        Omitting `credentials` leaves the stored ones alone. A form that submitted
        an empty secret field and blanked the key would be a support call, so the
        absence means "unchanged" rather than "clear".
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAIProviderRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProvider"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      operationId: deleteAIProvider
      tags: [ai]
      summary: Remove a provider
      description: |
        Refused while a tier assignment references it, naming how many are in the
        way. A delete that silently unassigned the reasoning tier would surface a
        week later as "why is every job failing".
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A tier assignment still uses it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: ai_provider_in_use
                message: This is used by 2 tier assignment(s). Reassign those tiers first.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/ai/providers/{providerID}/test:
    post:
      operationId: testAIProvider
      tags: [ai]
      summary: Probe what a model can actually do
      description: |
        Runs four small calls confirming chat, tool use, structured output, and
        vision, then writes back what worked. Detected capability overwrites
        declared capability, because the shipped defaults are a guess and this is a
        measurement (F-16.5).

        An unusable model reports why, so the UI can disable it with a reason
        rather than hiding it.
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                modelId:
                  type: string
                  format: uuid
                  description: Which model to probe. Defaults to the first enabled one.
      responses:
        "200":
          description: What the probe found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProbeResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: The provider or the AI service answered badly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/ai/models:
    get:
      operationId: listAIModels
      tags: [ai]
      summary: Configured models
      parameters:
        - name: providerID
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Models, with prices and capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIModelList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      operationId: createAIModel
      tags: [ai]
      summary: Add a model to a provider
      description: |
        Prices are per million tokens and live here rather than in code, because
        provider pricing changes and a deploy is the wrong way to track it.

        Capabilities may be omitted: they are seeded from a shipped defaults table
        for the provider kind and corrected by the Test connection probe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAIModelRequest"
            example:
              providerId: 6f1c9d2e-6b1a-4f7a-9c3e-2b8d5a4c1e77
              modelId: claude-opus-5
              displayName: Claude Opus 5
              tiers: [reasoning, code]
              priceInput: "15.00"
              priceOutput: "75.00"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIModel"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/ai/models/{modelID}:
    put:
      operationId: updateAIModel
      tags: [ai]
      summary: Update a model
      parameters:
        - $ref: "#/components/parameters/ModelID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAIModelRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIModel"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      operationId: deleteAIModel
      tags: [ai]
      summary: Remove a model
      parameters:
        - $ref: "#/components/parameters/ModelID"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A tier assignment still uses it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/ai/tiers:
    get:
      operationId: listAITiers
      tags: [ai]
      summary: Tier assignments
      description: |
        An agent asks for a tier, never a model. Resolution is the project
        assignment, then the global one, then an error that names the fix: never a
        silent code default.
      parameters:
        - name: projectID
          in: query
          required: false
          description: Project assignments. Omitted returns the global ones.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The assignments at that scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AITierAssignmentList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

    put:
      operationId: assignAITier
      tags: [ai]
      summary: Point a tier at a model
      description: |
        The model must declare the tier and have the capabilities it needs. A
        vision tier assigned a model that cannot read images is refused here rather
        than failing inside a job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignAITierRequest"
            example:
              tier: reasoning
              modelId: 3f9a2b41-6c7d-4e8f-9a1b-2c3d4e5f6a7b
      responses:
        "200":
          description: Assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AITierAssignment"
        "400":
          description: The model cannot serve that tier, or the project is not approved for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: ai_model_unusable_for_tier
                message: qwen2.5-coder cannot serve the vision tier. This model cannot read images, so it cannot serve the vision tier.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/ai/tiers/{assignmentID}:
    delete:
      operationId: unassignAITier
      tags: [ai]
      summary: Remove an assignment
      description: |
        A project assignment removed falls back to the global one. A global
        assignment removed leaves the tier unassigned, and jobs needing it are
        refused at enqueue with a message naming the tier.
      parameters:
        - name: assignmentID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/ai/budget:
    get:
      operationId: getAIBudget
      tags: [ai]
      summary: The spend ceiling and what it has used
      description: |
        The ceiling is checked before a call and again at enqueue, so a job is
        refused when a user presses submit rather than failing halfway through.
      parameters:
        - name: projectID
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The budget and current spend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIBudget"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

    put:
      operationId: updateAIBudget
      tags: [ai]
      summary: Change the ceiling
      description: |
        Writes the same settings the resolver reads, so this endpoint and the
        settings screen cannot disagree. Zero means no ceiling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAIBudgetRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIBudget"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/ai/spend:
    get:
      operationId: getAISpend
      tags: [ai]
      summary: What AI has cost
      description: |
        Genuine SQL aggregates over `llm_calls`, grouped by provider, project, and
        agent. The numbers reconcile exactly against a direct sum, because they are
        one.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: projectID
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Spend for the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISpend"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/requirements:
    get:
      operationId: listRequirements
      tags: [generation]
      summary: What the platform understood from the input
      description: |
        Every requirement carries the source reference it came from, so a reviewer
        can check it against the file rather than take it on trust (F-4.2).
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: artifactID
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/endpoints:
    get:
      operationId: listEndpoints
      tags: [generation]
      summary: The parsed endpoint model
      description: |
        Produced by deterministic parsing, never by a model. It is what the agents
        read, so seeing it is how a user checks that their specification was
        understood before paying for generation.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: artifactID
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Every parsed endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/coverage/requirements:
    get:
      operationId: getRequirementCoverage
      tags: [generation]
      summary: Which requirements have test cases
      description: |
        Requirement coverage, which is not code coverage and is never merged with
        it (FR-7.2). The uncovered requirements are listed rather than counted:
        "18 of 40" says there is a problem, and the list says where.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Coverage, with the uncovered requirements named.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementCoverage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/estimate:
    post:
      operationId: estimateGeneration
      tags: [generation]
      summary: What the next generation run will cost
      description: |
        Computed with the assigned provider's actual caching behaviour. The same
        specification can differ by roughly an order of magnitude between a
        provider with explicit caching and one with none, so a provider-agnostic
        number would be misleading.

        It is an estimate, and the assumptions are returned with it so it can be
        audited rather than believed.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The projection and its assumptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationEstimate"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Nothing has been ingested yet, or no model is assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/test-cases:
    get:
      operationId: listTestCases
      tags: [generation]
      summary: Generated and hand-written test cases
      description: |
        Filterable by requirement, category, priority, and status, cursor
        paginated, with a hard maximum page size. Cases merged into another are
        excluded: a duplicate is history rather than a row to filter out.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: requirementID
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TestCategory"
        - name: priority
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TestPriority"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TestCaseStatus"
        - name: search
          in: query
          required: false
          description: Matches the start of the title.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: A page of test cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCasePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      operationId: createTestCase
      tags: [generation]
      summary: Add a test case by hand
      description: |
        A hand-written case is approved on creation: somebody wrote it
        deliberately, and asking them to approve their own typing is ceremony. It
        is fingerprinted like a generated one, so it collides with a duplicate
        rather than sitting beside it.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestCaseRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/test-cases/bulk-status:
    post:
      operationId: setTestCaseStatuses
      tags: [generation]
      summary: Approve or reject in bulk
      description: |
        One transaction, and a capped batch: a bulk approve over 50,000 rows would
        hold a transaction open while a browser decides whether to finish the
        request.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkStatusRequest"
      responses:
        "200":
          description: How many changed.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
                    format: int64
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/test-cases/{testCaseID}:
    get:
      operationId: getTestCase
      tags: [generation]
      summary: One test case
      parameters:
        - $ref: "#/components/parameters/TestCaseID"
      responses:
        "200":
          description: The test case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      operationId: updateTestCase
      tags: [generation]
      summary: Edit a test case
      description: |
        Omitted fields are left alone. A case that was merged into another is
        read-only: editing the losing half of a merge would make the history lie.
      parameters:
        - $ref: "#/components/parameters/TestCaseID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTestCaseRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      operationId: deleteTestCase
      tags: [generation]
      summary: Delete a test case
      description: |
        Rejecting is usually what somebody wants: a rejected case stays visible and
        is not reproduced by the next run. Delete is for a case added by mistake.
      parameters:
        - $ref: "#/components/parameters/TestCaseID"
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/test-files:
    get:
      operationId: listTestFiles
      tags: [generation]
      summary: The generated suite
      description: |
        The tree, without file content: a 300-file suite is not something to load
        whole to draw a sidebar. Paged by path, so the order a browser shows and the
        order it pages in are the same one.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: framework
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TestFramework"
      responses:
        "200":
          description: A page of files, ordered by path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestFilePage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/test-files/export:
    get:
      operationId: exportTestFiles
      tags: [generation]
      summary: Download the whole suite as a zip
      description: |
        Streamed rather than built in memory, and deterministic: the same suite
        exports to the same bytes, so one export diffs against the last.

        The archive carries a scaffold and a README, so `npm install && npm test`
        works with only environment variables supplied. Nothing in it is
        hardcoded.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: framework
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TestFramework"
      responses:
        "200":
          description: A zip of the suite.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Nothing has been generated yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/test-files/postman:
    post:
      operationId: exportPostmanCollection
      tags: [generation]
      summary: Build a Postman collection from approved cases
      description: |
        Deterministic code rather than an agent: a collection is JSON with a known
        shape, and the approved cases already say what to call and what to assert.

        Base URL and auth are collection variables, not literals, so one export
        runs against any environment.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "201":
          description: The collection, stored as a file in the suite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestFile"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No approved test cases to export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: no_approved_test_cases
                message: No test cases are approved yet. Approve the ones you want implemented, then generate code.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/test-files/{testFileID}:
    get:
      operationId: getTestFile
      tags: [generation]
      summary: One file, with its content
      description: |
        Content is plain text. Highlighting is a frontend concern, and returning
        pre-rendered HTML would make the API responsible for a rendering decision
        it cannot see.
      parameters:
        - $ref: "#/components/parameters/TestFileID"
      responses:
        "200":
          description: The file and the cases it covers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestFileContent"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/test-files/{testFileID}/download:
    get:
      operationId: downloadTestFile
      tags: [generation]
      summary: Download one file
      parameters:
        - $ref: "#/components/parameters/TestFileID"
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/test-cases/{testCaseID}/files:
    get:
      operationId: listFilesForTestCase
      tags: [generation]
      summary: Where a test case is implemented
      description: |
        The traceability question in the other direction (F-6.11): given a case,
        which generated files implement it.
      parameters:
        - $ref: "#/components/parameters/TestCaseID"
      responses:
        "200":
          description: The files covering this case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestFileList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/runs:
    get:
      operationId: listRuns
      tags: [execution]
      summary: Run history
      description: |
        Newest first, cursor paginated. Every run carries its own counts, so a
        history page reads one table rather than aggregating results per row
        (F-12.6).
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunStatus"
        - name: type
          in: query
          required: false
          description: Only runs of this kind. Absent returns every kind.
          schema:
            $ref: "#/components/schemas/RunKind"
      responses:
        "200":
          description: A page of runs, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: triggerRun
      tags: [execution]
      summary: Run the approved suite against the target
      description: |
        The target host is checked against the project's allowlist here, on the
        server, before anything is queued, and checked again inside the runner at
        dial time. A browser-side check is not a control (F-7.7, F-7.8).

        A project with no target configured is refused with
        `no_target_configured`: generation works without a target, execution does
        not.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRunRequest"
      responses:
        "202":
          description: The run was queued. Watch its job for progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The target host is not on this project's allowlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: target_host_not_allowed
                message: Host "prod.example.com" is not on this project's allowlist. Add it in Settings, Project, Targets.
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No target configured, or this project already has a run in flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: no_target_configured
                message: This project has no target URL, so tests cannot be executed. Generation still works. Add a target in Settings, Project.
        "422":
          description: The target could not be resolved from the runner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: target_unresolvable
                message: Host "staging.example.com" could not be resolved from the runner, so a run cannot reach it.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/runs/trend:
    get:
      operationId: getRunTrend
      tags: [execution]
      summary: Pass rate, duration, and flake count over time
      description: |
        One row per finished run in the window, oldest first, so a chart plots it
        without reversing anything. A flaky test counts as neither a pass nor a
        failure in the rate, because that is what makes the rate honest.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: days
          in: query
          required: false
          description: How far back to look. Defaults to 30 days.
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: One point per finished run, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTrend"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/dashboard:
    get:
      operationId: getProjectDashboard
      tags: [execution]
      summary: The counts panel
      description: |
        Every count in one query rather than one request per number, and from one
        snapshot, so the figures reconcile with each other even while a run is
        writing results (F-12.1).
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Counts for the project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDashboard"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/runs/{runID}:
    get:
      operationId: getRun
      tags: [execution]
      summary: One run
      description: |
        Carries the digest-pinned image that executed, so a result can be traced to
        the exact image that produced it.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/runs/{runID}/cancel:
    post:
      operationId: cancelRun
      tags: [execution]
      summary: Cancel a queued or running run
      description: |
        The run is marked cancelled immediately and the container is killed and
        reaped by the worker holding it. Partial results are kept and labelled,
        because a run that got halfway still tells you something (F-2.6).
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The cancelled run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: run_not_cancelable
                message: This run is passed, so it cannot be cancelled.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/runs/{runID}/results:
    get:
      operationId: listRunResults
      tags: [execution]
      summary: One run's results
      description: |
        Failures first, then flaky, then the rest, so a 400-test run with three
        failures does not need paging to find them. Every attempt of a retried test
        is its own row, which is what makes a flaky verdict inspectable (F-7.11).
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunResultStatus"
      responses:
        "200":
          description: A page of results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResultPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/runs/{runID}/commands:
    get:
      operationId: listRunCommands
      tags: [execution]
      summary: What the runner executed
      description: |
        Every command a run issued, with its exit code and an output excerpt, so a
        run can be reconstructed after the fact (F-17.2). Redacted through the same
        handler as everything else: a credential passed to a suite never reaches
        this list.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The command log, in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunCommandList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/runs/{runID}/logs:
    get:
      operationId: streamRunLogs
      tags: [execution]
      summary: Live runner output
      description: |
        Server-sent events, over the same hub as job events. A viewer joining
        mid-run gets the log so far and then live output (F-7.9).

        A slow client is dropped with a marker rather than buffered without limit:
        the run must not slow down because somebody's tab is behind. The full log
        stays available from object storage once the run finishes.
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event received. Sent automatically by an EventSource on reconnect.
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: An event stream of `log` and `status` messages.
          content:
            text/event-stream:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/test-cases/{testCaseID}/history:
    get:
      operationId: getTestCaseHistory
      tags: [execution]
      summary: How this case has behaved across runs
      description: |
        The pattern rather than the last result: a test that alternates is flaky,
        and one run cannot show that.
      parameters:
        - $ref: "#/components/parameters/TestCaseID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: This case's recent results, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseHistory"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/runs/{runID}/analyses:
    get:
      operationId: listRunAnalyses
      tags: [analysis]
      summary: The explanations for a run's failures
      description: |
        One analysis per failing test, newest first when a failure has been analysed
        more than once. Every analysis carries structured evidence: a log line range,
        a response field path, a source location. A citation that did not check out
        never reached the database (F-9.2).
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The analyses for this run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: analyseRun
      tags: [analysis]
      summary: Explain this run's failures
      description: |
        Queues the analysis for a finished run. Automatic analysis is on by default,
        so this exists for the case where it was turned off, or where a prompt
        changed and the failures are worth a second look.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "202":
          description: The analysis was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The run has not finished, or produced nothing to explain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/run-results/{resultID}/analysis:
    get:
      operationId: getResultAnalysis
      tags: [analysis]
      summary: Why this test failed
      description: |
        The newest analysis for one failure. A 404 means nobody has explained it yet,
        which is a normal state rather than an error.

        The stability score is null when the platform has no repeat history to
        measure. Null means "not measurable", never zero: it is computed from the
        test's own behaviour across attempts and recent runs, and one observation is
        not a measurement (F-9.4).
      parameters:
        - $ref: "#/components/parameters/ResultID"
      responses:
        "200":
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/run-results/{resultID}/promote:
    post:
      operationId: promoteResult
      tags: [analysis]
      summary: File a defect from an analysed failure
      description: |
        One call turns a failure into a defect: title and description from the
        analysis, and the run result, test case, requirement, and analysis linked
        rather than copied (F-9.8).

        Idempotent. Promoting the same failure twice returns the defect that already
        exists with `200` instead of filing a second one.

        When an open defect already exists for the same test case with the same
        normalised root cause, the new defect is created and linked to it as a
        duplicate: three runs failing the same way is one defect with three
        occurrences, and an occurrence that leaves no row is one nobody can count
        (F-9.10).
      parameters:
        - $ref: "#/components/parameters/ResultID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteRequest"
      responses:
        "201":
          description: The defect was filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Defect"
        "200":
          description: This failure had already been promoted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Defect"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The failure has not been analysed yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: analysis_not_ready
                message: This failure has not been analysed yet, so there is nothing to promote. Run the analysis first.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/analyses/{analysisID}/feedback:
    put:
      operationId: setAnalysisFeedback
      tags: [analysis]
      summary: Say whether an analysis helped
      description: |
        A thumb up or down, stored with the prompt version behind the analysis, so
        prompt iteration is argued with numbers rather than impressions (F-9.6). One
        vote per person: voting again replaces the previous vote.
      parameters:
        - $ref: "#/components/parameters/AnalysisID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "204":
          description: The vote was recorded.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: clearAnalysisFeedback
      tags: [analysis]
      summary: Withdraw a vote
      parameters:
        - $ref: "#/components/parameters/AnalysisID"
      responses:
        "204":
          description: The vote was removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/analyses/feedback:
    get:
      operationId: getFeedbackByPromptVersion
      tags: [analysis]
      summary: How each prompt version has been received
      description: |
        Helpful and unhelpful counts per prompt version. This is the export that makes
        a prompt change measurable, which is why the version is stored on every vote
        rather than joined at read time.
      responses:
        "200":
          description: One row per prompt version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptFeedbackList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/defects:
    get:
      operationId: listDefects
      tags: [defects]
      summary: A project's defects
      description: |
        Newest first, cursor paginated, filterable by status, severity, assignee, and
        test case. Duplicates are hidden by default: a list showing every recurrence
        of the same bug is a list that hides the bugs.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DefectStatus"
        - name: severity
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DefectSeverity"
        - name: assigneeID
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: unassigned
          in: query
          required: false
          description: Only defects nobody owns, which is a different question from a named assignee.
          schema:
            type: boolean
        - name: testCaseID
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: includeDuplicates
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of defects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefectPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createDefect
      tags: [defects]
      summary: File a defect by hand
      description: |
        The built-in tracker works with no external integration configured at all,
        which is why it ships with the analysis phase rather than with the
        integrations (F-9.7).
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDefectRequest"
      responses:
        "201":
          description: The defect was filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Defect"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The defect is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/defects/{defectID}:
    get:
      operationId: getDefect
      tags: [defects]
      summary: One defect
      parameters:
        - $ref: "#/components/parameters/DefectID"
      responses:
        "200":
          description: The defect, with its occurrences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefectDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: updateDefect
      tags: [defects]
      summary: Edit a defect
      description: |
        A partial edit: a field that is absent is left alone, so a status change and a
        reassignment are the same endpoint without either overwriting the other. The
        resolution time follows the status rather than being set by a caller.
      parameters:
        - $ref: "#/components/parameters/DefectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDefectRequest"
      responses:
        "200":
          description: The updated defect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Defect"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The change conflicts with how duplicates work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/defects/{defectID}/duplicate:
    put:
      operationId: linkDefectDuplicate
      tags: [defects]
      summary: Link or unlink a duplicate
      description: |
        Points this defect at the original, or unlinks it when `duplicateOf` is null.
        Reversible on purpose: the platform proposes a link from a deterministic match
        on the test case and the normalised root cause, and a person who knows the two
        failures are unrelated has to be able to say so (F-9.10).
      parameters:
        - $ref: "#/components/parameters/DefectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkDuplicateRequest"
      responses:
        "200":
          description: The defect, linked or unlinked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Defect"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The two defects cannot be duplicates of each other.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/defects/{defectID}/comments:
    get:
      operationId: listDefectComments
      tags: [defects]
      summary: A defect's thread
      parameters:
        - $ref: "#/components/parameters/DefectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The comments, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefectCommentPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: commentOnDefect
      tags: [defects]
      summary: Comment on a defect
      parameters:
        - $ref: "#/components/parameters/DefectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "201":
          description: The comment was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefectComment"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The comment is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/reports:
    get:
      operationId: listReports
      tags: [analysis]
      summary: A project's generated reports
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of reports, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: requestReport
      tags: [analysis]
      summary: Generate a report
      description: |
        Queued rather than rendered inline: a project with hundreds of runs and dozens
        of analyses is not a request to hold open (F-12.5).

        Both formats render the same content from the same template. The PDF is printed
        by the browser in the runner image, so a worker with no container runtime
        produces HTML and refuses PDF with a stated reason rather than returning HTML
        under a `.pdf` name.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "202":
          description: The report was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The format is not one this platform renders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/reports/{reportID}:
    get:
      operationId: getReport
      tags: [analysis]
      summary: One report's status
      parameters:
        - $ref: "#/components/parameters/ReportID"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/reports/{reportID}/download:
    get:
      operationId: downloadReport
      tags: [analysis]
      summary: Download a finished report
      description: |
        Streamed from object storage. A report that is still generating is refused with
        `report_not_ready` rather than a 404: "not yet" and "never existed" are
        different answers to a client that is polling.
      parameters:
        - $ref: "#/components/parameters/ReportID"
      responses:
        "200":
          description: The report file.
          content:
            text/html:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The report is not ready yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: report_not_ready
                message: This report is running. It is not ready to download yet.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/repository:
    get:
      operationId: getRepository
      tags: [repository]
      summary: The project's connected repository
      description: |
        Includes what detection found and which files it read. An unknown stack is
        reported as unknown with that list, because a guess nobody can check is worse
        than an honest gap (F-6.7).
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryConnection"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No repository is connected to this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: no_repository_connected
                message: This project has no repository connected, so there is no source code to read. Connect one in Settings, Project, or upload an archive.
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: connectRepository
      tags: [repository]
      summary: Connect or replace the repository
      description: |
        Clone by URL with an optional token. The token is stored as a project secret
        and used by the worker; it never enters a runner container and is never
        returned once stored (F-3.5).

        The URL is checked against the project's target allowlist before any clone,
        for the same reason a run's target is: a worker cloning a URL a user supplied
        sits inside the network.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectRepositoryRequest"
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryConnection"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The URL or provider is not one this platform can use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: That provider is declared but not delivered yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: disconnectRepository
      tags: [repository]
      summary: Disconnect the repository
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "204":
          description: Disconnected. The stored token is left for an operator to clear deliberately.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/repository/sync:
    post:
      operationId: syncRepository
      tags: [repository]
      summary: Clone the repository and detect its stack
      description: |
        Queued, because a clone is slow and a checkout is large. The workspace is
        removed when the job ends, including on failure: nothing downstream holds one
        open, because a shared checkout is one job changing files under another.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRepositoryRequest"
      responses:
        "202":
          description: The sync was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No repository is connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/repository/map:
    get:
      operationId: getRepositoryMap
      tags: [repository]
      summary: What the last exploration found in the code
      description: |
        Controllers, services, data access, and the paths with no test, plus the trail
        of what the agent read to find them (F-4.4).

        Two fields are worth reading before the map itself. `cutShort` says the step
        budget ran out, so the map describes less than the agent wanted to cover.
        `unknowns` is what it could not work out, including any file it named that does
        not exist at this revision — those are dropped rather than shown, because a
        test written against a file that is not there is worse than a gap.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The newest map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryMap"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No map has been produced for this project yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: mapRepository
      tags: [repository]
      summary: Explore the repository and produce a map
      description: |
        Queued. The agent chooses one action at a time — read, grep, or glob — and the
        worker executes it against the checkout, because the process that owns the
        filesystem is the one that can safely validate a path. The budget comes from
        settings and running out ends the pass with a map rather than a failure.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRepositoryRequest"
      responses:
        "202":
          description: The exploration was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No repository is connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/coverage/code:
    get:
      operationId: getCodeCoverage
      tags: [repository]
      summary: Measured code coverage
      description: |
        Line and branch coverage as **the repository's own coverage tool** reported it,
        with per-file detail (F-7.14, F-12.3). The tool and the exact command are
        returned with the numbers, because "coverage is 74%" only means something
        alongside "as measured by vitest run --coverage".

        This is deliberately a different endpoint from requirement coverage and the two
        are never merged (FR-7.2): eighty per cent of requirements having a test case
        and eighty per cent of lines being executed are different facts, and averaging
        them describes neither.

        A project with no repository connected returns `404` with a reason rather than
        zero, because zero would be a claim about code this platform does not have.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The newest measurement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeCoverage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Nothing has been measured for this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: no_coverage_measured
                message: No code coverage has been measured for this project. Connect a repository and run a measurement.
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: measureCoverage
      tags: [repository]
      summary: Run the repository's coverage tool
      description: |
        Queued. The suite runs inside the runner container with no network, because
        running a client's tests on the worker would execute their code and their
        dependencies' install scripts on the host that holds every project's
        credentials.

        A repository that declares no coverage tool is refused rather than measured with
        instrumentation this platform added: that number would not match the client's
        own CI, which is the only thing the number is for.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRepositoryRequest"
      responses:
        "202":
          description: The measurement was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No repository is connected, or it declares no coverage tool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/unit-tests:
    post:
      operationId: generateUnitTests
      tags: [repository]
      summary: Write unit tests for the untested paths
      description: |
        Takes its targets from the repository map's untested paths, so an exploration has
        to have run first (F-6.3). The framework is the repository's own, read from its
        manifest rather than chosen by the model, and every generated file is compiled
        and scanned in the image that owns the toolchain before it is kept — with one
        correction attempt when it is rejected (BE-3.4).
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateUnitTestsRequest"
      responses:
        "202":
          description: Generation was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No repository map exists yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: no_repository_map
                message: This project has no repository map yet. Run an exploration to produce one.
        "409":
          description: The repository's test framework could not be identified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unknown_stack
                message: This platform could not identify the repository's test framework, so it will not guess one. Set repo.stack_override for this project.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/ui-flows:
    get:
      operationId: listUIFlows
      tags: [ui]
      summary: A project's discovery history
      description: |
        One row per discovery, newest first, without the graphs: a graph describes an
        application as it behaved at a moment, and when a later discovery finds two
        fewer pages the earlier one is what makes that visible.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The discoveries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UIFlowGraphList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: discoverUIFlows
      tags: [ui]
      summary: Walk the application and record what a user can do
      description: |
        Queued. A discovery drives a real browser through the application, one action at
        a time, and records the pages, what can be done on each, and the journeys worth
        testing (F-8.1). That beats reading component source, which cannot see that a
        route redirects to a login or that a panel renders only for an admin.

        Three things are enforced by the platform rather than asked for in a prompt: the
        action budget, so a discovery terminates; a refusal of anything that looks
        destructive, because this runs against somebody's environment; and the
        credentials, which are substituted inside the browser container and never
        reach the model or the recorded graph (BE-7.3).
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverUIFlowsRequest"
      responses:
        "202":
          description: The discovery was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No target is configured for this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: no_target_configured
                message: This project has no target URL, so there is nothing to explore.
        "503":
          description: No worker has a browser available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: no_browser_driver
                message: No browser driver is available right now. No worker has a container runtime.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/ui-flows/latest:
    get:
      operationId: getLatestUIFlowGraph
      tags: [ui]
      summary: The newest discovered flow graph
      description: |
        The graph is reviewable before anything is generated from it, which is the
        reason it is stored rather than passed straight to the generator: a suite built
        from a wrong graph is one somebody debugs test by test, and the graph is where
        the mistake is cheap to see (F-8.3).

        Two fields are worth reading before the pages. `cutShort` says the action
        budget ran out, so the graph covers less than the agent intended. `unreachable`
        is what was seen in a link and never opened, including anything the agent
        recorded without walking — those are dropped rather than shown, because a spec
        that navigates somewhere nobody reached fails on its first step.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The newest graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UIFlowGraph"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No discovery has run for this project yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: no_flow_graph
                message: This project has no discovered UI flows yet. Run a discovery to produce them.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/ui-flows/{flowID}:
    get:
      operationId: getUIFlowGraph
      tags: [ui]
      summary: One discovered flow graph
      parameters:
        - $ref: "#/components/parameters/FlowID"
      responses:
        "200":
          description: The graph, with the trail of what was clicked to find it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UIFlowGraph"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/ui-flows/{flowID}/review:
    post:
      operationId: reviewUIFlowGraph
      tags: [ui]
      summary: Record that somebody has read this graph
      description: |
        Generating from an unreviewed graph is still allowed: blocking it would mean an
        installation that wants the whole path automated cannot have it. What the flag
        buys is that "nobody looked at this" is visible rather than assumed.
      parameters:
        - $ref: "#/components/parameters/FlowID"
      responses:
        "200":
          description: The graph, now marked reviewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UIFlowGraph"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/ui-tests:
    post:
      operationId: generateUITests
      tags: [ui]
      summary: Write Playwright specs from a discovered flow graph
      description: |
        One spec per flow, taken from a graph that was walked in a real browser rather
        than from a router's declarations (F-6.4). By default the newest graph; name a
        graph to generate from the one somebody reviewed.

        Two gates stand between a generated file and the suite. The **selector policy**
        runs first and is a pure function of the text: a spec containing a positional
        selector — `nth-child`, a numeric `.nth(n)`, a structural pseudo-class, XPath —
        is rejected and regenerated, not merged with a warning. Then the file is
        compiled and scanned in the image that owns the toolchain, with one correction
        attempt (BE-3.4). A file that fails either gate twice is kept and marked for
        review rather than dropped silently.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateUITestsRequest"
      responses:
        "202":
          description: Generation was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No discovery has run for this project yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: no_flow_graph
                message: This project has no discovered UI flows yet. Run a discovery to produce them.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/runs/{runID}/artifacts:
    get:
      operationId: listRunArtifacts
      tags: [execution]
      summary: The recordings a run left behind
      description: |
        The video, trace, and screenshot of every failing test, captured on failure and
        discarded on success: a trace per passing test is megabytes nobody opens, and a
        trace for the one test that failed overnight is the difference between a bug
        report somebody can act on and "it was red yesterday" (F-7.10).

        Each item carries a time-limited `url` when the configured storage can sign
        one. When it cannot, the item still lists a `downloadPath`, which streams the
        same bytes through the platform.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run's artifacts, one row per file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunArtifactList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/run-results/{resultID}/artifacts/{kind}:
    get:
      operationId: downloadRunArtifact
      tags: [execution]
      summary: Download one recording
      description: |
        Streamed through the platform, so a viewer works whatever the storage driver is:
        the local-disk driver cannot sign a URL, and an artifact nobody can fetch is an
        artifact that was not captured.
      parameters:
        - $ref: "#/components/parameters/ResultID"
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RunArtifactKind"
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The result has no artifact of that kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/quarantines:
    get:
      operationId: listQuarantines
      tags: [execution]
      summary: The tests this project excuses
      description: |
        A test that flakes more often than the threshold stops failing the run and
        appears here instead (F-7.12). It keeps running and keeps recording results, so
        a fix is visible when it lands.

        Two fields make the list actionable rather than decorative: `ownerId`, who is
        answerable, and `ageHours` with `stale`, which say whether a quarantine is a
        decision somebody made last week or one nobody has looked at since spring.
        Nothing is released automatically — turning a forgotten flaky test into a
        suddenly red suite is the failure this feature exists to prevent.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - $ref: "#/components/parameters/Limit"
        - name: includeReleased
          in: query
          required: false
          description: Include quarantines that have ended. The history is what says whether a fix held.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The quarantines, live ones first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantineList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: quarantineTest
      tags: [execution]
      summary: Quarantine a test by hand
      description: |
        For the case the threshold cannot see: a test somebody already knows is
        unreliable, or one whose environment is broken for a week. Recorded as a manual
        quarantine, with whoever asked as its owner.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarantineRequest"
      responses:
        "201":
          description: Quarantined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quarantine"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/quarantines/{quarantineID}/owner:
    put:
      operationId: assignQuarantineOwner
      tags: [execution]
      summary: Take ownership of a quarantine
      description: |
        An automatic quarantine starts with nobody's name on it, which is exactly what
        the review list exists to surface. This is how somebody claims one.
      parameters:
        - $ref: "#/components/parameters/QuarantineID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarantineOwnerRequest"
      responses:
        "200":
          description: The quarantine, now owned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quarantine"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No live quarantine with that ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: quarantine_not_found
                message: That quarantine does not exist, or it has already been released.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/quarantines/{quarantineID}/release:
    post:
      operationId: releaseQuarantine
      tags: [execution]
      summary: End a quarantine
      description: |
        The test starts failing the run again from the next run onwards. The row is kept
        rather than deleted: the history of what used to be flaky is what tells somebody
        whether a fix held.
      parameters:
        - $ref: "#/components/parameters/QuarantineID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarantineReleaseRequest"
      responses:
        "200":
          description: Released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quarantine"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No live quarantine with that ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/test-data/shapes:
    get:
      operationId: listTestDataShapes
      tags: [testdata]
      summary: What this project can generate data for
      description: |
        One entry per endpoint with a schema worth generating from, with its field names
        so a UI can offer per-field AI enrichment rather than asking somebody to type a
        path exactly. Endpoints that declare no request or response schema are omitted:
        an option that produces one empty record is not an option.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The shapes available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDataShapeList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/test-data:
    post:
      operationId: generateTestData
      tags: [testdata]
      summary: Generate test data from the specification's own schemas
      description: |
        Deterministic and free (F-10.1). The response carries the seed that produced it,
        and the same seed and count reproduce the data byte for byte — which is what
        makes a failure on record 63 reproducible instead of a story about somebody's
        machine.

        Type, format, pattern, enum, and the length and range bounds are honoured,
        because data that violates the schema tests the validator rather than the
        endpoint. **Payment card numbers come only from published test ranges** and are
        never freshly generated (F-10.4).

        `fields` opts individual fields into an AI pass for the cases where semantics
        matter — a plausible address, a correctly shaped tax identifier (F-10.2). It is
        per field on purpose: the bulk is a seeded faker, and a model asked for two
        thousand values would cost money to be occasionally wrong. Whatever the model
        does not answer keeps the generated value, and the response says so.

        Set `format` to stream the set as CSV, JSON, or SQL inserts instead of the JSON
        envelope (F-10.5).
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTestDataRequest"
      responses:
        "200":
          description: The generated set, or the export stream when a format was named.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDataSet"
            text/csv:
              schema:
                type: string
            application/sql:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/test-data/invalid:
    post:
      operationId: generateInvalidTestData
      tags: [testdata]
      summary: Generate boundary and invalid records
      description: |
        Every record breaks exactly **one** constraint and names which (F-10.3). One at
        a time, because a payload that is simultaneously too long, the wrong type, and
        missing a required field tells you the endpoint rejected something without
        telling you what it checks.

        The values come from the schema's own constraints — a field with `maxLength: 40`
        gets a 41-character value, a field with `minimum: 1` gets 0 — so the set is
        specific to the API rather than generic noise. `injection` cases carry
        attack-shaped values; the expectation for those is not "rejected" but "stored
        and returned verbatim, never executed", because an API may legitimately accept
        an apostrophe in a surname.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInvalidTestDataRequest"
      responses:
        "200":
          description: The invalid set, each record naming the constraint it breaks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidTestDataSet"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/test-data/tables:
    get:
      operationId: listDumpTables
      tags: [testdata]
      summary: What tables an uploaded SQL dump declares
      description: |
        Reads `CREATE TABLE` statements out of a schema-only dump and reports the columns
        in the terms that shape generated data: type, length, nullability, and any value
        list a check constraint declares (F-3.7).

        The parse is deliberately narrow — triggers, functions, grants, and data are
        ignored. A dump is a program, and a parser with opinions about a client's schema
        beyond its column list would be a parser it cannot justify.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
        - name: artifactID
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The tables the dump declares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DumpTableList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The artifact is not a readable schema dump.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/mock-server:
    get:
      operationId: getMockServer
      tags: [testdata]
      summary: The project's mock server
      description: |
        The status, the URL a client application points at, and the fault settings in
        force (F-10.6). The status is reconciled against the host on every read: a row
        that says running with no container behind it would be a panel telling somebody
        an untruth.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The mock server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockServer"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: This project has never started one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: no_mock_server
                message: This project has no mock server. Start one to get a URL a client application can point at.
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: startMockServer
      tags: [testdata]
      summary: Start or replace the mock server
      description: |
        Generated from the project's own specification: one route per endpoint, with
        schema-valid response bodies produced by the same seeded generator that writes
        test data (F-10.6). The bodies are generated here in Go, not in the container, so
        the mock has no dependencies and there is no second faker to keep in step.

        `faults` is what a real staging environment cannot give a team: a fixed delay, a
        share of requests that fail with chosen status codes, and a share that never
        answer at all (F-10.7). The pattern is seeded, so "30% failures" is the same 30%
        on the next run and a client test that fails is failing for a reason.

        It runs as its own container with the same isolation as every other — read-only
        root filesystem, non-root, dropped capabilities, cgroup limits, no outbound
        network — with one exception it has to have: a published port. Its address is
        added to the project's target allowlist automatically, so a generated suite can
        reach it without anybody editing settings after every restart.

        Starting while one is running replaces it. The intent is "serve this
        configuration", not "add a second container".

        Queued rather than synchronous, because a mock needs a container and this process
        deliberately has no container runtime — the same split as running a suite.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartMockServerRequest"
      responses:
        "202":
          description: >-
            The start was queued. A mock needs a container, so it starts where the
            runtime is; poll the mock server or the job's events for its URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The project's specification declares nothing to mock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: no_mock_routes
                message: This project's specification declares no endpoints, so there is nothing to mock. Upload a specification first.
        "422": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: This host cannot run a mock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: mock_unavailable
                message: A mock server cannot be started here. No container runtime is available on this host.
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: stopMockServer
      tags: [testdata]
      summary: Stop the mock server
      description: |
        Safe to call twice: stopping a container that is already gone is a success, and
        the row is corrected either way. The routes are kept, so starting again serves
        the same mock.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "202":
          description: The stop was queued, on the host holding the container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/performance-tests:
    post:
      operationId: startPerformanceTest
      tags: [performance]
      summary: Generate and run a load test
      description: |
        A `code`-tier agent writes a k6 script from the API's endpoints under the load
        profile you set, and the script runs in the k6 container with the same isolation
        as every other run (F-11.1, F-11.2). The profile — virtual users, ramp, hold — is
        yours, not the model's: it says how hard to hit the target, and the agent is told
        to use the numbers exactly.

        Performance testing is off by default and must be enabled per project by a lead.
        The first run against a **new host** is refused with `host_confirmation_required`
        until you resend the request with `confirmHost` naming that exact host — because
        a load test pointed at a machine you do not own is a denial-of-service attempt
        (BE-9.5).

        The measured series — latency percentiles and throughput — is read from
        `/runs/{runID}/metrics` when the run finishes.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPerformanceRequest"
      responses:
        "202":
          description: The load test was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Performance testing is disabled, or the host needs confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                disabled:
                  value:
                    code: test_kind_disabled
                    message: performance testing is disabled for this project. A QA Lead or Admin must enable it first.
                confirm:
                  value:
                    code: host_confirmation_required
                    message: This is the first performance run against staging.example.com. Confirm the host to authorise it.
        "422": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/runs/{runID}/metrics:
    get:
      operationId: getRunMetrics
      tags: [performance]
      summary: A performance run's measured series
      description: |
        Latency percentiles and throughput, read from k6's own summary (F-11.2). Only a
        performance run produces them; a functional run returns `no_performance_metrics`.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The measured series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceMetrics"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: This run has no metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/projects/{projectID}/security-scans:
    post:
      operationId: startSecurityScan
      tags: [security]
      summary: Plan and run a security scan
      description: |
        A `code`-tier agent chooses which endpoints and which **reviewed library
        payloads** to probe — SQLi, XSS, JWT tampering, IDOR, and the rest — and the
        platform sends them (F-11.3). The agent never writes an attack string: the
        payloads live in a versioned Go library, and the plan names payload IDs, so no
        request this platform sends was chosen by a model.

        Each probe that its detection rule matches becomes a finding with a severity,
        the evidence the rule matched, and reproduction steps, promotable to a defect
        through the same path a failed test uses (BE-9.4).

        Security testing is off by default and enabled per project by a lead. The first
        scan against a **new host** is refused with `host_confirmation_required` until
        resent with `confirmHost` naming it — pointed at a machine you do not own, these
        are indistinguishable from an intrusion attempt (BE-9.5).
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSecurityScanRequest"
      responses:
        "202":
          description: The scan was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobReference"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Security testing is disabled, the host needs confirmation, or there is nothing to probe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/runs/{runID}/findings:
    get:
      operationId: listRunFindings
      tags: [security]
      summary: A security scan's findings
      description: |
        One per probe that succeeded, most severe first, each citing the reviewed payload
        it came from and the evidence the detection rule matched (F-11.4). A finding is a
        failed result with security detail, so it is promoted to a defect through the
        result's own promote path.
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The findings, most severe first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityFindingList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/mcp/servers:
    get:
      operationId: listMCPServers
      tags: [integrations]
      summary: Configured MCP servers
      description: |
        MCP is entirely optional: every capability it fronts has a built-in that needs no
        server, and this list being empty is a supported configuration (ai-architecture.md
        5.4).
      responses:
        "200":
          description: The configured servers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServerList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createMCPServer
      tags: [integrations]
      summary: Add an MCP server
      description: |
        A new server starts **deny-all**: no tools are enabled until an admin runs the
        connection test and opts into specific ones. The credential is encrypted, and a
        project-scoped server is reachable only from its project (ai-architecture.md 5.4,
        5.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPServerRequest"
      responses:
        "201":
          description: Added, with no tools enabled yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/mcp/servers/{serverID}:
    get:
      operationId: getMCPServer
      tags: [integrations]
      summary: One MCP server
      parameters:
        - $ref: "#/components/parameters/ServerID"
      responses:
        "200":
          description: The server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: updateMCPServer
      tags: [integrations]
      summary: Update an MCP server and its allowlist
      description: |
        This is where an admin opts into tools after a connection test: `enabledTools` is
        the allowlist, and a tool not in it is refused before it leaves the platform.
      parameters:
        - $ref: "#/components/parameters/ServerID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPServerRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteMCPServer
      tags: [integrations]
      summary: Remove an MCP server
      description: |
        The server's call history is kept: the rows lose their server link but not the
        record that the calls happened, which is what an audit needs.
      parameters:
        - $ref: "#/components/parameters/ServerID"
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/mcp/servers/{serverID}/test:
    post:
      operationId: testMCPServer
      tags: [integrations]
      summary: Test the connection and list the server's tools
      description: |
        Connects to the server and lists the tools it exposes, so an admin can opt into
        specific ones. The tools are stored on the server and the health status updated;
        nothing is enabled by this call (ai-architecture.md 5.4).
      parameters:
        - $ref: "#/components/parameters/ServerID"
      responses:
        "200":
          description: The connection result and the tools found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: The server could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServer"
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/mcp/calls:
    get:
      operationId: listMCPCalls
      tags: [integrations]
      summary: The MCP call audit
      description: |
        Every MCP tool call — server, tool, redacted arguments, status, agent, job — most
        recent first. A call the allowlist refused appears as `denied` (ai-architecture.md
        5.5).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: serverID
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: projectID
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The recorded calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPCallList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: Health of every optional integration
      description: |
        One line per adapter across every capability — the notifier channels, the defect
        trackers, the source providers, the run triggers, the object store — with its
        state: `builtin` for the always-on default, `active` for a configured external
        adapter that answers, `not_configured` for one with no settings (FR-10.6). This is
        how an admin sees at a glance what is in use and what has degraded to the built-in.
      responses:
        "200":
          description: The integration health report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: qavia_session
      description: |
        Server-side session. Sessions live in Postgres rather than in a JWT, so
        revocation is immediate: an offboarded employee's access ends when the row
        is deleted, with no token TTL to wait out.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Every list has a hard maximum; there is no unbounded list.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's nextCursor. Do not construct one.
      schema:
        type: string
        maxLength: 512
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactID:
      name: artifactID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobID:
      name: jobID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderID:
      name: providerID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelID:
      name: modelID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServerID:
      name: serverID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuarantineID:
      name: quarantineID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlowID:
      name: flowID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportID:
      name: reportID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResultID:
      name: resultID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnalysisID:
      name: analysisID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DefectID:
      name: defectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunID:
      name: runID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TestCaseID:
      name: testCaseID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TestFileID:
      name: testFileID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Supported on every mutating endpoint a CI system or webhook can retry.
        Replaying the same key with the same body returns the original result;
        reusing it with a different body is a conflict.
      schema:
        type: string
        maxLength: 255

  schemas:
    Error:
      type: object
      description: |
        The single error shape. Produced only by the mapper in
        internal/platform/httpx, so every failure looks the same.
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable and machine readable. Branch on this, never on message. Every
            value is catalogued in docs/error-codes.md.
          example: target_host_not_allowed
        message:
          type: string
          description: Safe to show a user, and says what to do next.
          example: Host "api.example.test" is not on this project's allowlist. Add it in Settings, Project, Targets.
        details:
          type: object
          additionalProperties: true
          description: Field-level context for inline rendering. Never carries a secret.
          example:
            host: api.example.test
        incidentId:
          type: string
          description: |
            Present only on a 500. The handle between what the user saw and the
            full wrapped cause in the log, which is never returned.
          example: 9f2c1a7e

    SecretRead:
      type: object
      description: |
        How every stored secret reads back. The plaintext is never returned by any
        code path, so a UI offers Replace rather than edit.
      required: [isSet]
      properties:
        isSet:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        hint:
          type: string
          description: First and last few characters only, enough to recognise which key is stored.
          example: sk-a…XyZ4
      example:
        isSet: true
        updatedAt: "2026-08-10T09:14:22Z"
        hint: sk-a…XyZ4

    NextCursor:
      type: [string, "null"]
      description: Pass as cursor to fetch the next page. Null or absent means the last page.
      example: eyJjIjoiMjAyNi0wOC0xMFQwOToxNDoyMloifQ

    JobReference:
      type: object
      description: |
        Returned with 202 by every long operation. The client subscribes to the
        job rather than waiting: the user may close the browser and be notified
        when the chain finishes.
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JobStatus"
        eventsUrl:
          type: string
          description: SSE endpoint for live status and the event log.
          example: /api/v1/jobs/6f1c.../events
      example:
        jobId: 6f1c9d2e-6b1a-4f7a-9c3e-2b8d5a4c1e77
        status: queued
        eventsUrl: /api/v1/jobs/6f1c9d2e-6b1a-4f7a-9c3e-2b8d5a4c1e77/events

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    Role:
      type: string
      description: |
        The four platform roles. Authorisation is enforced per route group on the
        server; a client uses this only to decide what to render.
      enum: [admin, qa_lead, qa_engineer, viewer]

    User:
      type: object
      description: |
        A user as the API returns them. There is no password field in this schema,
        so a hash cannot appear in a response even by accident
        (backend-standards.md 4).
      required: [id, email, name, role, timezone, disabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        timezone:
          type: string
          description: IANA name. All timestamps are stored UTC and displayed in this zone (NFR-7).
          example: Asia/Kolkata
        disabled:
          type: boolean
        lastLoginAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          # No minLength here on purpose: rejecting a short password at the schema
          # layer would tell an attacker their guess was too short to be real.
          maxLength: 1024

    AcceptInviteRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          maxLength: 512
        name:
          type: string
          maxLength: 200
        password:
          type: string
          maxLength: 1024

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 1024
        newPassword:
          type: string
          maxLength: 1024

    InviteUserRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        name:
          type: string
          maxLength: 200
        role:
          $ref: "#/components/schemas/Role"

    Invitation:
      type: object
      description: |
        Returned once, when the invitation is created. The token is stored hashed,
        so this link cannot be produced again: a lost link is replaced by issuing a
        new invitation.
      required: [user, acceptUrl, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        acceptUrl:
          type: string
          description: Send this to the invitee. Shown once.
          example: http://localhost:3000/accept-invite?token=9f2c1a7e...
        expiresAt:
          type: string
          format: date-time

    SettingScope:
      type: string
      description: |
        Where a value is stored. Resolution order is user, then project, then global,
        then the declared default.
      enum: [global, project, user]

    SettingKind:
      type: string
      description: |
        Selects the form control and the accessor. A `secret` is encrypted at rest
        and never returned.
      enum: [string, int, number, bool, enum, string_list, duration, object, secret]

    SettingEntry:
      type: object
      description: One setting's complete declaration.
      required: [key, category, label, kind, scopes, minRole, isSecret, restartRequired, schema]
      properties:
        key:
          type: string
          example: runner.timeout_seconds
        category:
          type: string
          description: Groups the entry on the settings screen.
          example: Runner
        label:
          type: string
        helpText:
          type: string
        kind:
          $ref: "#/components/schemas/SettingKind"
        default:
          description: |
            The value used when nothing is stored at any scope. Absent for a secret,
            which has no default by design.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/SettingScope"
        minRole:
          $ref: "#/components/schemas/Role"
        isSecret:
          type: boolean
        restartRequired:
          type: boolean
          description: Badge the field and warn on save.
        schema:
          type: object
          additionalProperties: true
          description: |
            JSON Schema for this value. Convert it to your own validator at runtime
            rather than hand-writing rules, so client and server validation come from
            one declaration.
      example:
        key: storage.retention_days
        category: Storage
        label: Artifact retention (days)
        helpText: Logs, screenshots, videos, and traces older than this are deleted.
        kind: int
        default: 90
        scopes: [global]
        minRole: admin
        isSecret: false
        restartRequired: false
        schema:
          title: Artifact retention (days)
          type: integer
          minimum: 1
          maximum: 3650

    SettingsRegistry:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SettingEntry"

    SettingValue:
      type: object
      description: |
        One resolved value. `source` is which scope supplied it, so a UI can show
        that a value is inherited.
      required: [key, source, fromDefault]
      properties:
        key:
          type: string
        value:
          description: Absent for a secret. Use `secret` instead.
        source:
          $ref: "#/components/schemas/SettingScope"
        fromDefault:
          type: boolean
          description: True when nothing was stored and the declared default was used.
        updatedAt:
          type: [string, "null"]
          format: date-time
        secret:
          $ref: "#/components/schemas/SecretRead"

    SettingValues:
      type: object
      required: [values]
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/SettingValue"

    SettingChange:
      type: object
      required: [key, scope, value]
      properties:
        key:
          type: string
          maxLength: 200
        scope:
          $ref: "#/components/schemas/SettingScope"
        projectID:
          type: string
          format: uuid
          description: Required for a project-scoped change.
        userID:
          type: string
          format: uuid
          description: |
            Required for a user-scoped change. A user may always write their own;
            writing another user's needs the setting's minimum role.
        value:
          description: |
            The new value, matching the entry's schema. For a secret, the plaintext
            as a JSON string; it is encrypted before it is stored and cannot be read
            back.

    UpdateSettingsRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SettingChange"

    CheckStatus:
      type: string
      enum: [ok, failing, not_configured]

    DependencyCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          example: object_store
        status:
          $ref: "#/components/schemas/CheckStatus"
        detail:
          type: string
          description: |
            Which implementation answered, or why it failed. Never contains a
            credential.
          example: local-disk

    Liveness:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DependencyCheck"

    SetupStatus:
      type: object
      description: |
        What first-run setup still needs. Only `adminExists` and `storageReachable`
        block completion; a missing AI provider is reported so the wizard can offer
        it, and enforced at enqueue time.
      required: [complete, adminExists, storageReachable, aiProviderConfigured, storageProvider]
      properties:
        complete:
          type: boolean
          description: True when an admin exists and storage answered a write-and-read-back probe.
        adminExists:
          type: boolean
        storageReachable:
          type: boolean
        storageDetail:
          type: string
          description: Why storage failed, if it did. Never contains a credential.
        storageProvider:
          type: string
          example: local-disk
        aiProviderConfigured:
          type: boolean
          description: False is not a setup failure. AI jobs are refused at enqueue with a clear reason.
      example:
        complete: false
        adminExists: false
        storageReachable: true
        storageProvider: local-disk
        aiProviderConfigured: false

    CreateAdminRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        name:
          type: string
          maxLength: 200
        password:
          type: string
          maxLength: 1024
        timezone:
          type: string
          description: IANA name. Defaults to the platform default when omitted.
          maxLength: 100

    TestType:
      type: string
      description: |
        The kinds of test a project generates. A type that is not implemented yet is
        still selectable and is returned as unavailable, so the UI disables it with a
        reason rather than hiding it (F-3.12).
      enum:
        - test_cases
        - api_tests
        - unit_tests
        - ui_tests
        - performance_tests
        - security_tests
        - test_data
        - mock_server

    TestTypeSelection:
      type: object
      description: One selected test type and whether the platform can act on it yet.
      required: [type, available]
      properties:
        type:
          $ref: "#/components/schemas/TestType"
        available:
          type: boolean
        reason:
          type: string
          description: Why it is unavailable, phrased for a user.
          example: UI tests arrive in phase 7.
      example:
        type: ui_tests
        available: false
        reason: UI tests arrive in phase 7.

    Project:
      type: object
      required:
        [id, name, description, ownerId, testTypes, externalAiApproved, archived, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        ownerId:
          type: string
          format: uuid
        testTypes:
          type: array
          items:
            $ref: "#/components/schemas/TestTypeSelection"
        externalAiApproved:
          type: boolean
          description: |
            Without this a project may only use providers marked local. Enforced
            server-side before an AI job is enqueued (F-16.13).
        archived:
          type: boolean
          description: An archived project is readable and read-only.
        archivedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        testTypes:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/TestType"

    UpdateProjectRequest:
      type: object
      description: Omitted fields are left alone.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        testTypes:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/TestType"

    ProjectMember:
      type: object
      description: |
        Membership carries its own role, separate from the platform role, and the
        narrower of the two applies.
      required: [userId, email, name, role, isOwner, createdAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        isOwner:
          type: boolean
          description: Ownership counts as membership, so an owner never has to add themselves.
        createdAt:
          type: string
          format: date-time

    ProjectMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"

    ArtifactKind:
      type: string
      description: |
        What an input is, which decides how it is parsed. Values grow with the
        phases, so this is a checked set rather than a database enum.
      enum: [openapi, postman, requirement_text, source_archive, sql_dump, document]

    Artifact:
      type: object
      required:
        [id, projectId, kind, filename, contentType, sizeBytes, sha256, version, lineageId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        filename:
          type: string
        contentType:
          type: string
          description: The sniffed type, not what the client claimed.
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
          description: Hex. Computed while streaming, and the identity of the content.
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        version:
          type: integer
          description: A changed file with the same name and kind increments this; earlier versions stay.
        lineageId:
          type: string
          format: uuid
          description: Groups the versions of one logical input.
        deduplicated:
          type: boolean
          description: |
            Present on upload. True means this exact content was already stored, so
            nothing was written and no generation was re-run (FR-1.4).
        uploadedBy:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time

    ArtifactPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    JobChain:
      type: string
      description: |
        Chains are declared in one place on the server. A handler never calls the
        next handler directly, so every stage is independently retryable and
        independently observable.
      enum: [noop, ai_smoke, ingest, generate, execute, analyse]

    SubmitJobRequest:
      type: object
      required: [chain]
      properties:
        chain:
          $ref: "#/components/schemas/JobChain"
        artifactId:
          type: string
          format: uuid
          description: The input to work from, where the chain needs one.

    JobEventLevel:
      type: string
      enum: [debug, info, warn, error]

    JobEvent:
      type: object
      description: One line of the live event log. `id` doubles as the SSE Last-Event-ID.
      required: [id, level, message, at]
      properties:
        id:
          type: string
          description: Ascending. Pass the last one you saw as Last-Event-ID to resume.
          example: "4821"
        level:
          $ref: "#/components/schemas/JobEventLevel"
        message:
          type: string
        at:
          type: string
          format: date-time

    Job:
      type: object
      required: [id, type, status, progress, attempts, maxAttempts, queuedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: [string, "null"]
          format: uuid
        type:
          type: string
          description: The handler that runs this stage.
          example: noop.stage1
        chain:
          $ref: "#/components/schemas/JobChain"
        status:
          $ref: "#/components/schemas/JobStatus"
        progress:
          type: integer
          minimum: 0
          maximum: 100
        attempts:
          type: integer
        maxAttempts:
          type: integer
        error:
          type: [string, "null"]
          description: Set once retries are exhausted. Never carries a credential.
        parentJobId:
          type: [string, "null"]
          format: uuid
        stages:
          type: array
          description: Present on a parent job, so one request describes the whole chain.
          items:
            $ref: "#/components/schemas/Job"
        events:
          type: array
          description: The most recent event lines. The SSE stream carries the rest.
          items:
            $ref: "#/components/schemas/JobEvent"
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time

    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    NotificationKind:
      type: string
      enum:
        - job_completed
        - job_failed
        - job_needs_input
        - run_completed
        - drift_detected
        - integration_failed
        - admin_alert

    Notification:
      type: object
      required: [id, kind, title, body, link, read, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/NotificationKind"
        title:
          type: string
        body:
          type: string
        link:
          type: string
          description: Deep link to what this is about (FR-8.5).
          example: /projects/6f1c9d2e/jobs/8a3b1c22
        read:
          type: boolean
        readAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    NotificationPage:
      type: object
      required: [items, unread]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unread:
          type: integer
          description: Included so the badge and the list cannot disagree.
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    AuditEntry:
      type: object
      required: [id, action, subject, at]
      properties:
        id:
          type: string
          description: Ascending, and the pagination cursor.
          example: "18422"
        actorId:
          type: [string, "null"]
          format: uuid
          description: Null for something the system did on its own, such as a scheduled check.
        actorEmail:
          type: string
          description: |
            Recorded separately from the actor row, because an audit entry that
            cannot name who acted is not an audit entry.
        action:
          type: string
          example: setting_changed
        subject:
          type: string
          description: "What was acted on: an email, a setting key, a host."
        projectId:
          type: [string, "null"]
          format: uuid
        ip:
          type: [string, "null"]
        detail:
          type: object
          additionalProperties: true
          description: Typed context. Passes through the logger's redaction, so it holds no secret.
        at:
          type: string
          format: date-time

    AuditEntryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    WebhookTriggerRequest:
      type: object
      required: [chain]
      properties:
        chain:
          $ref: "#/components/schemas/JobChain"
        artifactId:
          type: string
          format: uuid
        reference:
          type: string
          maxLength: 200
          description: Free text recorded on the job, for example a branch or a build number.

    AIProviderKind:
      type: string
      description: |
        `openai-compatible` is the row that makes "any other provider" real: one
        adapter reaches Ollama, vLLM, LiteLLM, OpenRouter, Together, Groq,
        Fireworks and DeepSeek.
      enum: [anthropic, bedrock, vertex, openai, azure-openai, gemini, openai-compatible]

    AIDataResidency:
      type: string
      description: |
        Where a provider processes data. A project without external AI approval may
        only be assigned a `local` provider, enforced server-side before enqueue.
      enum: [local, regional, external]

    AITier:
      type: string
      description: What a call is for, rather than which model runs it.
      enum: [reasoning, code, cheap, vision]

    AIHealth:
      type: string
      enum: [unknown, ok, failing]

    AICapabilities:
      type: object
      description: |
        What a model can actually do. Features are gated on this: a model without
        tool use is disqualified from the agents that need tools, and the reason is
        returned so the UI explains rather than hides.
      required: [toolUse, vision, structuredOutput, promptCaching, effortControl, maxToolIterations]
      properties:
        toolUse:
          type: boolean
        vision:
          type: boolean
        structuredOutput:
          type: string
          enum: [native, tool_based, prompt_only]
          description: prompt_only adds a JSON-repair pass, because the provider enforces nothing.
        promptCaching:
          type: string
          enum: [explicit, automatic, none]
          description: |
            Drives the cost estimate. The same 40-endpoint specification can differ
            by an order of magnitude between a provider with explicit caching and
            one with none.
        effortControl:
          type: boolean
        maxToolIterations:
          type: integer

    AIProvider:
      type: object
      required: [id, name, kind, dataResidency, enabled, isDefault, health, credentials, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AIProviderKind"
        config:
          type: object
          additionalProperties: true
          description: "Non-secret settings: base URL, region, project, API version, deployment."
        dataResidency:
          $ref: "#/components/schemas/AIDataResidency"
        enabled:
          type: boolean
        isDefault:
          type: boolean
        credentials:
          $ref: "#/components/schemas/SecretRead"
        health:
          $ref: "#/components/schemas/AIHealth"
        healthDetail:
          type: string
        healthCheckedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AIProviderList:
      type: object
      required: [items, kinds]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AIProvider"
        kinds:
          type: array
          description: Kinds this build can serve, so the UI cannot offer one that would fail.
          items:
            $ref: "#/components/schemas/AIProviderKind"

    CreateAIProviderRequest:
      type: object
      required: [name, kind, credentials]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: "#/components/schemas/AIProviderKind"
        config:
          type: object
          additionalProperties: true
        dataResidency:
          $ref: "#/components/schemas/AIDataResidency"
        credentials:
          type: object
          additionalProperties:
            type: string
          description: |
            Shape varies by kind. Write-only: it is encrypted at rest and reads back
            as {isSet, updatedAt, hint}.
        enabled:
          type: boolean
          default: true
        makeDefault:
          type: boolean
          default: false

    UpdateAIProviderRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        config:
          type: object
          additionalProperties: true
        dataResidency:
          $ref: "#/components/schemas/AIDataResidency"
        credentials:
          type: object
          additionalProperties:
            type: string
          description: Omit to leave the stored credentials alone. Present replaces them.
        enabled:
          type: boolean
          default: true
        makeDefault:
          type: boolean
          default: false

    AIModel:
      type: object
      required: [id, providerId, modelId, tiers, capabilities, priceInput, priceOutput, enabled]
      properties:
        id:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        modelId:
          type: string
          description: The provider's own identifier.
        displayName:
          type: string
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/AITier"
        capabilities:
          $ref: "#/components/schemas/AICapabilities"
        priceInput:
          type: string
          description: USD per million input tokens. A string, because money is decimal and JSON numbers are not.
          example: "15.00"
        priceOutput:
          type: string
        priceCacheRead:
          type: [string, "null"]
        priceCacheWrite:
          type: [string, "null"]
        maxInputTokens:
          type: [integer, "null"]
        maxOutputTokens:
          type: [integer, "null"]
        enabled:
          type: boolean

    AIModelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AIModel"

    CreateAIModelRequest:
      type: object
      required: [providerId, modelId, tiers]
      properties:
        providerId:
          type: string
          format: uuid
        modelId:
          type: string
          minLength: 1
          maxLength: 200
        displayName:
          type: string
          maxLength: 200
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/AITier"
        capabilities:
          $ref: "#/components/schemas/AICapabilities"
        priceInput:
          type: string
        priceOutput:
          type: string
        priceCacheRead:
          type: string
        priceCacheWrite:
          type: string
        maxInputTokens:
          type: integer
        maxOutputTokens:
          type: integer
        enabled:
          type: boolean
          default: true

    UpdateAIModelRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 200
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/AITier"
        capabilities:
          $ref: "#/components/schemas/AICapabilities"
        priceInput:
          type: string
        priceOutput:
          type: string
        priceCacheRead:
          type: string
        priceCacheWrite:
          type: string
        maxInputTokens:
          type: integer
        maxOutputTokens:
          type: integer
        enabled:
          type: boolean
          default: true

    AITierAssignment:
      type: object
      required: [id, scope, tier, modelId]
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [global, project]
        projectId:
          type: [string, "null"]
          format: uuid
        tier:
          $ref: "#/components/schemas/AITier"
        modelId:
          type: string
          format: uuid
        fallbackModelId:
          type: [string, "null"]
          format: uuid
          description: |
            Used on retryable failures only: rate limit, overload, connection
            failure. Never on a 400, which would bill the same mistake twice.
        effort:
          type: [string, "null"]
        updatedAt:
          type: string
          format: date-time

    AITierAssignmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AITierAssignment"

    AssignAITierRequest:
      type: object
      required: [tier, modelId]
      properties:
        tier:
          $ref: "#/components/schemas/AITier"
        modelId:
          type: string
          format: uuid
        fallbackModelId:
          type: string
          format: uuid
        effort:
          type: string
          maxLength: 40
        projectID:
          type: string
          format: uuid
          description: Omitted assigns the global tier.

    AIProbeResult:
      type: object
      required: [providerId, modelId, reachable, capabilities]
      properties:
        providerId:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
        reachable:
          type: boolean
        capabilities:
          $ref: "#/components/schemas/AICapabilities"
        detail:
          type: string
          description: What failed, phrased for a user. Never contains a credential.
        latencyMs:
          type: integer

    AIBudget:
      type: object
      required: [ceilingUsd, period, onCeiling, spentUsd, periodStart]
      properties:
        ceilingUsd:
          type: string
          description: Zero means no ceiling.
          example: "500.00"
        period:
          type: string
          enum: [day, week, month]
        onCeiling:
          type: string
          enum: [block, warn]
        spentUsd:
          type: string
        periodStart:
          type: string
          format: date-time
        projectId:
          type: [string, "null"]
          format: uuid

    UpdateAIBudgetRequest:
      type: object
      properties:
        ceilingUsd:
          type: string
        period:
          type: string
          enum: [day, week, month]
        onCeiling:
          type: string
          enum: [block, warn]
        projectID:
          type: string
          format: uuid
          description: Sets the ceiling for one project instead of the platform.

    AISpendGroup:
      type: object
      required: [key, label, calls, inputTokens, outputTokens, cacheReadTokens, costUsd]
      properties:
        key:
          type: string
          description: Provider ID, project ID, or agent name, depending on the grouping.
        label:
          type: string
        calls:
          type: integer
          format: int64
        inputTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        cacheReadTokens:
          type: integer
          format: int64
        costUsd:
          type: string

    AISpend:
      type: object
      required: [from, to, totalCostUsd, totalCalls, byProvider, byProject, byAgent]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        totalCostUsd:
          type: string
        totalCalls:
          type: integer
          format: int64
        totalInputTokens:
          type: integer
          format: int64
        totalOutputTokens:
          type: integer
          format: int64
        totalCacheReadTokens:
          type: integer
          format: int64
        byProvider:
          type: array
          items:
            $ref: "#/components/schemas/AISpendGroup"
        byProject:
          type: array
          items:
            $ref: "#/components/schemas/AISpendGroup"
        byAgent:
          type: array
          items:
            $ref: "#/components/schemas/AISpendGroup"

    RequirementKind:
      type: string
      description: |
        What sort of requirement this is. Validation rules and edge cases are the
        two that produce the most test cases, which is why they are separate kinds
        rather than prose inside a feature.
      enum: [feature, business_rule, validation_rule, auth, edge_case]

    Requirement:
      type: object
      required: [id, kind, title, body, sourceRef, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/RequirementKind"
        title:
          type: string
        body:
          type: string
        sourceRef:
          type: string
          description: Where in the uploaded file this came from, as line:column or a character range.
        endpointId:
          type: [string, "null"]
          format: uuid
        artifactId:
          type: [string, "null"]
          format: uuid
        generatedBy:
          type: string
          description: The model that produced it, so output quality traces back to what produced it.
        createdAt:
          type: string
          format: date-time

    RequirementPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    RequirementCoverage:
      type: object
      description: |
        Requirement coverage only. Code coverage is a separate number and the two
        are never merged (FR-7.2).
      required: [total, covered, uncovered]
      properties:
        total:
          type: integer
          format: int64
        covered:
          type: integer
          format: int64
        uncovered:
          type: array
          description: Named rather than counted, so a user can act on it.
          items:
            $ref: "#/components/schemas/Requirement"

    EndpointSummary:
      type: object
      description: One parsed operation, as deterministic code normalized it.
      required: [method, path]
      properties:
        method:
          type: string
        path:
          type: string
        operationId:
          type: string
        summary:
          type: string
        description:
          type: string
        parameterCount:
          type: integer
        responseCodes:
          type: array
          items:
            type: string
        secured:
          type: boolean
        sourceRef:
          type: string

    EndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EndpointSummary"

    TestPriority:
      type: string
      enum: [critical, high, medium, low]

    TestCategory:
      type: string
      enum: [functional, negative, boundary, security, auth, performance, data]

    TestCaseStatus:
      type: string
      description: |
        Rejected is terminal for a generated case: reviving one the team already
        refused should be a deliberate new case rather than a status flip.
      enum: [draft, approved, rejected]

    TestStep:
      type: object
      required: [action]
      properties:
        action:
          type: string
        data:
          type: string
        expected:
          type: string

    TestCase:
      type: object
      required: [id, projectId, title, steps, priority, category, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        requirementId:
          type: [string, "null"]
          format: uuid
        title:
          type: string
        preconditions:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/TestStep"
        expected:
          type: string
        priority:
          $ref: "#/components/schemas/TestPriority"
        category:
          $ref: "#/components/schemas/TestCategory"
        status:
          $ref: "#/components/schemas/TestCaseStatus"
        supersededBy:
          type: [string, "null"]
          format: uuid
          description: Set when this case was merged into another one.
        generatedBy:
          type: string
          description: Empty for a hand-written case.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TestCasePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TestCase"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    CreateTestCaseRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        requirementId:
          type: string
          format: uuid
        preconditions:
          type: string
          maxLength: 2000
        steps:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/TestStep"
        expected:
          type: string
          maxLength: 2000
        priority:
          $ref: "#/components/schemas/TestPriority"
        category:
          $ref: "#/components/schemas/TestCategory"
        endpoint:
          type: string
          description: "METHOD /path, so a hand-written case is fingerprinted like a generated one."
          maxLength: 300
        assertion:
          type: string
          description: A short phrase naming what is checked. Defaults to the title.
          maxLength: 300

    UpdateTestCaseRequest:
      type: object
      description: Omitted fields are left alone.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        preconditions:
          type: string
          maxLength: 2000
        steps:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/TestStep"
        expected:
          type: string
          maxLength: 2000
        priority:
          $ref: "#/components/schemas/TestPriority"
        category:
          $ref: "#/components/schemas/TestCategory"
        status:
          $ref: "#/components/schemas/TestCaseStatus"

    BulkStatusRequest:
      type: object
      required: [ids, status]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
        status:
          $ref: "#/components/schemas/TestCaseStatus"

    GenerationEstimate:
      type: object
      description: |
        A projection, not a quote. The assumptions are returned so it can be
        audited: the same specification differs by roughly an order of magnitude
        between a provider with prompt caching and one without.
      required:
        [providerName, modelName, promptCaching, endpoints, requirements, calls, costUsd]
      properties:
        providerName:
          type: string
        modelName:
          type: string
        promptCaching:
          type: string
          enum: [explicit, automatic, none]
        endpoints:
          type: integer
          format: int64
        requirements:
          type: integer
          format: int64
        calls:
          type: integer
          format: int64
        prefixTokens:
          type: integer
          format: int64
        inputTokens:
          type: integer
          format: int64
        cachedTokens:
          type: integer
          format: int64
        outputTokens:
          type: integer
          format: int64
        costUsd:
          type: string

    TestFramework:
      type: string
      description: |
        What a file is written for. Supertest and Postman are delivered in this
        phase; the rest are declared so the API and the UI agree about what exists,
        and asking for one returns a reason rather than nothing.
      enum: [supertest, postman, jest, vitest, playwright, cypress, k6, pytest]

    TestFile:
      type: object
      description: One generated file, without its content.
      required: [id, projectId, framework, path, testCaseIds, sizeBytes, generatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        framework:
          $ref: "#/components/schemas/TestFramework"
        path:
          type: string
          description: Repository-relative and forward-slashed. Validated before storage.
        testCaseIds:
          type: array
          description: The cases this file implements, which is what makes traceability work.
          items:
            type: string
            format: uuid
        generatedBy:
          type: string
        validatedAt:
          type: [string, "null"]
          format: date-time
          description: |
            Null means static validation has not run yet, which is not the same as
            having failed.
        validationNote:
          type: string
        sizeBytes:
          type: integer
        generatedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TestFileContent:
      allOf:
        - $ref: "#/components/schemas/TestFile"
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: Plain text. Highlighting is a frontend concern.

    FileCoverage:
      type: object
      required: [path, linesTotal, linesCovered]
      properties:
        path:
          type: string
        linesTotal:
          type: integer
        linesCovered:
          type: integer
        branchesTotal:
          type: integer
        branchesCovered:
          type: integer
        lineRate:
          type: number
          format: double
          nullable: true
          description: >-
            Null when the file has no executable lines. An interface or a type
            declaration is not a file with no coverage, and showing it as 0% would put
            it at the top of a list of things to fix when there is nothing to fix.

    CodeCoverage:
      type: object
      required: [id, projectId, tool, command, linesTotal, linesCovered, measuredAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        commit:
          type: string
          description: The revision measured, so a rise or fall is attributable to a change.
        tool:
          type: string
          description: Which coverage tool produced this. Always the repository's own.
        command:
          type: string
          description: The exact command that ran, because a percentage means nothing without it.
        linesTotal:
          type: integer
        linesCovered:
          type: integer
        branchesTotal:
          type: integer
        branchesCovered:
          type: integer
        lineRate:
          type: number
          format: double
          nullable: true
        branchRate:
          type: number
          format: double
          nullable: true
          description: Null when the tool does not measure branches. Several do not, and zero would claim every conditional is untested.
        files:
          type: array
          description: Per-file detail, least covered first.
          items:
            $ref: "#/components/schemas/FileCoverage"
        measuredAt:
          type: string
          format: date-time

    GenerateUnitTestsRequest:
      type: object
      properties:
        ref:
          type: string
          maxLength: 255
        targets:
          type: array
          description: Narrow generation to these files. Empty means every untested path the map found.
          items:
            type: string

    MappedController:
      type: object
      required: [file, name]
      properties:
        file:
          type: string
        name:
          type: string
        routes:
          type: array
          items:
            type: string
        calls:
          type: array
          items:
            type: string

    MappedComponent:
      type: object
      required: [file, name]
      properties:
        file:
          type: string
        name:
          type: string
        responsibility:
          type: string

    MappedDataStore:
      type: object
      required: [file, name]
      properties:
        file:
          type: string
        name:
          type: string
        tables:
          type: array
          items:
            type: string

    UncoveredPath:
      type: object
      required: [file, symbol]
      properties:
        file:
          type: string
        symbol:
          type: string
        why:
          type: string

    ExplorationStep:
      type: object
      required: [action]
      properties:
        action:
          type: string
          description: read, grep, or glob.
        detail:
          type: string
        reason:
          type: string
        refused:
          type: boolean
          description: The platform refused this step, such as a path outside the checkout.

    RepositoryMap:
      type: object
      required: [id, projectId, steps, cutShort, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        commit:
          type: string
          description: The revision this map describes. A map with no commit is one nobody can tell is stale.
        stack:
          type: string
        summary:
          type: string
        controllers:
          type: array
          items:
            $ref: "#/components/schemas/MappedController"
        services:
          type: array
          items:
            $ref: "#/components/schemas/MappedComponent"
        dataAccess:
          type: array
          items:
            $ref: "#/components/schemas/MappedDataStore"
        uncovered:
          type: array
          description: Paths with no test, named as symbols. The percentage is the coverage tool's job.
          items:
            $ref: "#/components/schemas/UncoveredPath"
        unknowns:
          type: array
          description: What the exploration could not work out, including files it named that do not exist.
          items:
            type: string
        trail:
          type: array
          description: What the agent read, in order. An exploration nobody can retrace is a conclusion nobody can check.
          items:
            $ref: "#/components/schemas/ExplorationStep"
        steps:
          type: integer
        cutShort:
          type: boolean
          description: The step budget ran out, so the map covers less than the agent intended.
        modelName:
          type: string
        createdAt:
          type: string
          format: date-time

    RepositoryProvider:
      type: string
      description: |
        `git` is clone-by-URL and `archive` is an uploaded zip; both work with no
        external platform configured. The rest are declared so the API and the UI
        agree about what exists, and asking for one returns a reason rather than
        nothing.
      enum: [git, github, gitlab, bitbucket, archive]

    DetectedStack:
      type: object
      required: [confident, inspected]
      properties:
        language:
          type: string
        framework:
          type: string
        packageManager:
          type: string
        version:
          type: string
        testCommand:
          type: string
          description: The repository's own test script where it defines one, rather than an assumption.
        coverageTool:
          type: string
          description: The repository's own coverage tool. The only thing permitted to produce a coverage number.
        confident:
          type: boolean
          description: False when nothing recognisable was found. The platform then says unknown and waits for an override.
        inspected:
          type: array
          description: Every file detection read, in order. This is what makes an unknown result actionable.
          items:
            type: string
        summary:
          type: string

    RepositoryConnection:
      type: object
      required: [id, projectId, provider, url, hasCredential, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/RepositoryProvider"
        url:
          type: string
        defaultBranch:
          type: string
        hasCredential:
          type: boolean
          description: Whether a token is stored. The token itself is never returned.
        lastCommit:
          type: string
          description: The revision the last clone actually fetched, not the branch name.
        lastFetchedAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          description: Why the last clone failed, so a connection that looks fine but never works says so.
        detected:
          $ref: "#/components/schemas/DetectedStack"
        detectedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ConnectRepositoryRequest:
      type: object
      required: [url]
      properties:
        provider:
          $ref: "#/components/schemas/RepositoryProvider"
        url:
          type: string
          maxLength: 2048
        defaultBranch:
          type: string
          maxLength: 255
        token:
          type: string
          maxLength: 512
          description: >-
            A read-only access token for a private repository. Stored as a project
            secret and never returned. Omit it to keep an existing token, or send an
            empty string to clear it.

    DiscoverUIFlowsRequest:
      type: object
      properties:
        targetUrl:
          type: string
          maxLength: 2048
          description: |
            Explore this URL instead of the project's configured target. Checked
            against the same allowlist, because an override is exactly the input that
            must not be trusted.

    GenerateUITestsRequest:
      type: object
      properties:
        flowId:
          type: string
          format: uuid
          description: >-
            Generate from this graph rather than the newest one. A reviewer who
            approved a graph meant that graph.
        flows:
          type: array
          maxItems: 50
          description: Only these journeys, by name. Absent means every flow in the graph.
          items:
            type: string

    UIFlowGraph:
      type: object
      required: [id, projectId, target, authMode, steps, cutShort, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        target:
          type: string
          description: What was explored. A graph with no target is one nobody can tell is stale.
        authMode:
          type: string
          description: |
            How the discovery signed in. Without this, a graph with no authenticated
            pages cannot be told apart from one that never logged in.
        summary:
          type: string
        pages:
          type: array
          items:
            $ref: "#/components/schemas/UIPage"
        flows:
          type: array
          description: Journeys worth a test, each one the agent actually walked.
          items:
            $ref: "#/components/schemas/UIFlow"
        unreachable:
          type: array
          description: Seen in a link and never opened, or recorded without being walked and therefore dropped.
          items:
            type: string
        unknowns:
          type: array
          description: What the discovery could not determine, so the graph is honest about its edges.
          items:
            type: string
        trail:
          type: array
          description: Every action and where it landed, in order. A discovery nobody can retrace is a graph nobody can check.
          items:
            $ref: "#/components/schemas/UIDiscoveryStep"
        artifacts:
          type: array
          description: The video, trace, and screenshots the discovery recorded, with time-limited URLs.
          items:
            $ref: "#/components/schemas/UIArtifact"
        steps:
          type: integer
        cutShort:
          type: boolean
          description: The action budget ran out, so the graph covers less than the agent intended.
        pageCount:
          type: integer
        flowCount:
          type: integer
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        modelName:
          type: string
        createdAt:
          type: string
          format: date-time

    UIFlowGraphSummary:
      type: object
      required: [id, projectId, target, authMode, pageCount, flowCount, steps, cutShort, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        target:
          type: string
        authMode:
          type: string
        pageCount:
          type: integer
        flowCount:
          type: integer
        steps:
          type: integer
        cutShort:
          type: boolean
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        modelName:
          type: string
        createdAt:
          type: string
          format: date-time

    UIFlowGraphList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UIFlowGraphSummary"

    UIPage:
      type: object
      required: [path, requiresAuth]
      properties:
        path:
          type: string
        title:
          type: string
        purpose:
          type: string
        requiresAuth:
          type: boolean
        actions:
          type: array
          items:
            $ref: "#/components/schemas/UIPageAction"

    UIPageAction:
      type: object
      required: [description]
      description: |
        One thing a user can do, named the way the selector policy prefers — a test id,
        then a role with its accessible name, then a label — so a spec can be written
        from it without inventing a locator.
      properties:
        description:
          type: string
        testid:
          type: string
        role:
          type: string
        name:
          type: string
        label:
          type: string
        leadsTo:
          type: string

    UIFlow:
      type: object
      required: [name, requiresAuth]
      properties:
        name:
          type: string
        purpose:
          type: string
        requiresAuth:
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/UIFlowStep"

    UIFlowStep:
      type: object
      required: [action]
      properties:
        action:
          type: string
        target:
          type: string
        testid:
          type: string
        role:
          type: string
        name:
          type: string
        label:
          type: string
        value:
          type: string
          description: >-
            A credential is never here. The placeholders $QAVIA_USERNAME and
            $QAVIA_PASSWORD stand in for one, and the browser substitutes them.
        expect:
          type: string
          description: What should be true afterwards. A step with nothing to assert passes when the page is blank.

    UIDiscoveryStep:
      type: object
      required: [action]
      properties:
        action:
          type: string
        detail:
          type: string
        reason:
          type: string
        url:
          type: string
        refused:
          type: boolean
          description: The platform refused this action, such as one that looked destructive or led off the target.

    UIArtifact:
      type: object
      required: [name, bytes]
      properties:
        name:
          type: string
        bytes:
          type: integer
          format: int64
        contentType:
          type: string
        url:
          type: string
          description: |
            A time-limited URL. Absent when the storage driver cannot sign one, in
            which case the object is fetched through the platform instead.

    SyncRepositoryRequest:
      type: object
      properties:
        ref:
          type: string
          maxLength: 255
          description: A branch or tag to fetch instead of the connection's default.

    ReportFormat:
      type: string
      enum: [html, pdf]

    ReportStatus:
      type: string
      enum: [queued, running, ready, failed]

    Report:
      type: object
      required: [id, projectId, format, status, windowDays, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        format:
          $ref: "#/components/schemas/ReportFormat"
        status:
          $ref: "#/components/schemas/ReportStatus"
        windowDays:
          type: integer
          description: How far back this report looks, so two reports of one project are distinguishable by content.
        sizeBytes:
          type: integer
          format: int64
        error:
          type: string
          description: Why generation failed, in words a user can act on. Empty otherwise.
        jobId:
          type: string
          format: uuid
          nullable: true
        requestedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true

    ReportPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    ReportRequest:
      type: object
      properties:
        format:
          $ref: "#/components/schemas/ReportFormat"
        days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30

    EvidenceKind:
      type: string
      description: |
        What a citation points at. Every reference is checked against the artifact it
        names before the analysis is stored, so a `log` reference to a line the log
        does not have never reaches a client.
      enum: [log, response, source, history]

    EvidenceReference:
      type: object
      required: [kind, detail]
      properties:
        kind:
          $ref: "#/components/schemas/EvidenceKind"
        detail:
          type: string
          description: What this reference shows. The label on a link, not the explanation.
        file:
          type: string
          description: Set for source references, and for log references that name a file.
        fromLine:
          type: integer
        toLine:
          type: integer
        path:
          type: string
          description: Dotted field path for a response reference, such as data.items[0].id.
        quote:
          type: string
          description: The text the analysis claims is there. Compared against the cited lines.

    Analysis:
      type: object
      required: [id, runResultId, reason, rootCause, evidence, createdAt]
      properties:
        id:
          type: string
          format: uuid
        runResultId:
          type: string
          format: uuid
        reason:
          type: string
          description: One line, for a list.
        rootCause:
          type: string
        suggestedFix:
          type: string
          description: Advice, never applied. Nothing in this platform writes to a repository.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceReference"
        relatedCommit:
          type: string
        stabilityScore:
          type: number
          format: double
          nullable: true
          description: |
            How consistently this test behaves, from 0 to 1, computed from its own
            results: the proportion of recent runs that passed, reduced by how often
            the result changed, and capped when a retry inside one run flipped it.

            Null when the platform has no repeat history to measure. Null means "not
            measurable", never zero, and it is never a number a model reported about
            itself.
        stabilityBasis:
          type: string
          description: Which signals produced the score, or why there is none.
        promptVersion:
          type: string
        modelName:
          type: string
        createdAt:
          type: string
          format: date-time

    AnalysisList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Analysis"

    FeedbackRequest:
      type: object
      required: [helpful]
      properties:
        helpful:
          type: boolean
        note:
          type: string
          maxLength: 2000

    PromptFeedback:
      type: object
      required: [promptVersion, helpful, unhelpful]
      properties:
        promptVersion:
          type: string
        helpful:
          type: integer
        unhelpful:
          type: integer

    PromptFeedbackList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PromptFeedback"

    DefectSeverity:
      type: string
      enum: [critical, high, medium, low]

    DefectStatus:
      type: string
      description: |
        `duplicate` is a status and a link: a duplicate that is only a link disappears
        from every status filter, and a status with no link leaves a defect nobody can
        navigate away from. Set it by linking, not by assignment.
      enum: [open, acknowledged, in_progress, fixed, wont_fix, duplicate]

    Defect:
      type: object
      required: [id, projectId, title, severity, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        runResultId:
          type: string
          format: uuid
          nullable: true
        testCaseId:
          type: string
          format: uuid
          nullable: true
        requirementId:
          type: string
          format: uuid
          nullable: true
        analysisId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
        severity:
          $ref: "#/components/schemas/DefectSeverity"
        status:
          $ref: "#/components/schemas/DefectStatus"
        assigneeId:
          type: string
          format: uuid
          nullable: true
        duplicateOf:
          type: string
          format: uuid
          nullable: true
        externalRef:
          type: object
          additionalProperties: true
          description: Where this defect lives in an external tracker. Empty with no integration configured.
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    DefectDetail:
      type: object
      required: [defect, occurrences]
      properties:
        defect:
          $ref: "#/components/schemas/Defect"
        occurrences:
          type: array
          description: >-
            The defects linked to this one as duplicates: the same failure recurring.
          items:
            $ref: "#/components/schemas/Defect"

    DefectPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Defect"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
        counts:
          type: object
          description: The project's defects by status, so a summary strip needs no second request.
          additionalProperties:
            type: integer

    CreateDefectRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        severity:
          $ref: "#/components/schemas/DefectSeverity"
        assigneeId:
          type: string
          format: uuid
        testCaseId:
          type: string
          format: uuid
        requirementId:
          type: string
          format: uuid

    UpdateDefectRequest:
      type: object
      description: A partial edit. An absent field is left alone.
      properties:
        title:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        severity:
          $ref: "#/components/schemas/DefectSeverity"
        status:
          $ref: "#/components/schemas/DefectStatus"
        assigneeId:
          type: string
          format: uuid
          description: Reassigns the defect. Absent leaves the assignee alone.
        clearAssignee:
          type: boolean
          description: >-
            Unassigns the defect. A separate flag rather than a null assigneeId,
            because absent and null are the same value on the wire once a client
            omits a field, and "leave it alone" and "clear it" must not be.

    LinkDuplicateRequest:
      type: object
      properties:
        duplicateOf:
          type: string
          format: uuid
          description: >-
            The original this defect duplicates. Omit it to unlink, which is
            unambiguous here because unlinking is the only other thing this endpoint
            does.

    PromoteRequest:
      type: object
      properties:
        severity:
          $ref: "#/components/schemas/DefectSeverity"
        assigneeId:
          type: string
          format: uuid

    DefectComment:
      type: object
      required: [id, defectId, body, system, createdAt]
      properties:
        id:
          type: string
          format: uuid
        defectId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
          nullable: true
          description: Null for a comment the platform wrote, such as a duplicate link.
        body:
          type: string
        system:
          type: boolean
        createdAt:
          type: string
          format: date-time

    DefectCommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DefectComment"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    CommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 20000

    RunStatus:
      type: string
      description: |
        `queued` and `running` are in flight. `passed` and `failed` are outcomes of a
        suite that ran. `error` means the suite could not run, which is a different
        thing from failing, and `cancelled` means somebody stopped it.
      enum: [queued, running, passed, failed, errored, cancelled]

    RunResultStatus:
      type: string
      description: |
        `flaky` is its own status rather than a pass or a failure: a test whose
        result changed across attempts is reporting something about itself, not
        about the code under test (F-7.11).
      enum: [passed, failed, flaky, skipped, errored]

    RunTrigger:
      type: string
      enum: [manual, webhook, schedule, api]

    Run:
      type: object
      required: [id, projectId, targetUrl, trigger, status, framework, image, total, passed, failed, flaky, skipped, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
          nullable: true
          description: The chain executing this run, for progress and cancellation.
        targetUrl:
          type: string
          description: Where this run executed, recorded on the row for after-the-fact attribution.
        trigger:
          $ref: "#/components/schemas/RunTrigger"
        status:
          $ref: "#/components/schemas/RunStatus"
        framework:
          $ref: "#/components/schemas/TestFramework"
        image:
          type: string
          description: |
            The runner image that executed, by digest. A tag would mean this run
            cannot say what produced its results.
        kind:
          $ref: "#/components/schemas/RunKind"
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        flaky:
          type: integer
        skipped:
          type: integer
        quarantined:
          type: integer
          description: >-
            Tests the project excused. Counted separately from passed, because a suite
            where six tests are excused is not a suite where they all pass.
        durationMs:
          type: integer
        error:
          type: string
          description: Why the suite could not run. Empty for a run that ran, whatever its results.
        hasLog:
          type: boolean
          description: Whether the full log was stored. False means the run produced no output worth keeping.
        triggeredBy:
          type: string
          format: uuid
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"

    TriggerRunRequest:
      type: object
      properties:
        framework:
          $ref: "#/components/schemas/TestFramework"
        targetUrl:
          type: string
          maxLength: 2048
          description: |
            Overrides the project's configured target for this run. Checked against
            the allowlist exactly like the configured one, because an override is
            the input least worth trusting.

    RunResult:
      type: object
      required: [id, runId, name, status, attempt]
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        testCaseId:
          type: string
          format: uuid
          nullable: true
          description: |
            Null when the platform could not map this result to exactly one case. A
            wrong mapping is worse than none: it would put a passing result on a
            case that never ran.
        testFileId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        status:
          $ref: "#/components/schemas/RunResultStatus"
        durationMs:
          type: integer
        attempt:
          type: integer
          description: 1 for the first run of a test, incrementing per retry.
        quarantined:
          type: boolean
          description: >-
            The project excuses this test, so its failure did not fail the run. The
            status still says what actually happened.
        failureMessage:
          type: string
        artifacts:
          $ref: "#/components/schemas/RunResultArtifacts"

    DumpColumn:
      type: object
      required: [name, type, notNull]
      properties:
        name:
          type: string
        type:
          type: string
          description: The declared SQL type without its length, lowercased.
        length:
          type: integer
          description: The character limit where the type declared one, so a generated value fits the column.
        notNull:
          type: boolean
        primaryKey:
          type: boolean
        enum:
          type: array
          description: The value list from a check constraint, which is how a dump usually expresses an enumeration.
          items:
            type: string

    DumpTable:
      type: object
      required: [name, columns]
      properties:
        name:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/DumpColumn"

    DumpTableList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DumpTable"
        warnings:
          type: array
          description: What the parse could not read, named rather than silently skipped.
          items:
            type: string

    MockFaults:
      type: object
      description: >-
        What a real staging environment cannot be made to do on demand. The pattern is
        seeded, so the same share of failures falls in the same places on every run.
      properties:
        delayMs:
          type: integer
          minimum: 0
          maximum: 30000
          description: Delay on every response, for exercising a client's timeout handling.
        failureRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Share of requests answered with a failure status.
        statusCodes:
          type: array
          maxItems: 10
          description: Which failures to choose from. Empty means 500.
          items:
            type: integer
            minimum: 400
            maximum: 599
        timeoutRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >-
            Share of requests that get no answer at all. A different failure from a 504,
            and the one that finds a missing timeout in a client.
        seed:
          type: integer
          format: int64

    StartMockServerRequest:
      type: object
      properties:
        faults:
          $ref: "#/components/schemas/MockFaults"
        samples:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
          description: >-
            Response bodies generated per endpoint, rotated in order. More than one so a
            client listing twice does not see byte-identical data.
        seed:
          type: integer
          format: int64
          description: Makes the generated bodies reproducible, so a test written against the mock keeps passing for the right reason.

    MockServerStatus:
      type: string
      enum: [stopped, running, failed]

    MockServer:
      type: object
      required: [projectId, status, routeCount]
      properties:
        projectId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/MockServerStatus"
        url:
          type: string
          description: Where a client application points. Empty when nothing is running.
        routeCount:
          type: integer
        faults:
          $ref: "#/components/schemas/MockFaults"
        image:
          type: string
        error:
          type: string
          description: Why a start failed. A button that did nothing and a start that failed are different things.
        uptimeSeconds:
          type: integer
        startedAt:
          type: string
          format: date-time
          nullable: true
        stoppedAt:
          type: string
          format: date-time
          nullable: true

    TestDataFormat:
      type: string
      description: Absent returns the JSON envelope with the seed; a value streams the export.
      enum: [json, csv, sql]

    TestDataSource:
      type: object
      description: >-
        Where the shape comes from: an endpoint of the project's specification, or a
        table of an uploaded SQL dump. Exactly one is needed.
      properties:
        dumpArtifactId:
          type: string
          format: uuid
          description: >-
            An uploaded `sql_dump` artifact. Parsed locally: no database credential and
            no MCP server are involved, which is why this path works on a fresh install.
        table:
          type: string
          maxLength: 120
          description: Which table of the dump. Optional when the dump declares exactly one.
        endpoint:
          type: string
          description: "\"METHOD /path\" from this project's specification. The request body's schema is used, or the success response's when there is no body."
          maxLength: 500
        response:
          type: string
          description: Generate from this response's schema instead of the request's, for seeding a fixture or a mock.
          maxLength: 10

    GenerateTestDataRequest:
      type: object
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/TestDataSource"
        count:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10
        seed:
          type: integer
          format: int64
          description: >-
            Reproduces an earlier set exactly. Omit to be given one, which the response
            reports so the same data can be asked for again.
        locale:
          type: string
          maxLength: 20
          description: Shapes the values that have a country, such as an address or a phone number.
        fields:
          type: array
          maxItems: 20
          description: >-
            Fields to fill with an AI pass. Opt-in per field: the bulk is a seeded
            faker, and anything the model does not answer keeps the generated value.
          items:
            type: string
        format:
          $ref: "#/components/schemas/TestDataFormat"
        table:
          type: string
          maxLength: 80
          description: Table name for SQL output. Filtered to a safe identifier, not merely quoted.

    GenerateInvalidTestDataRequest:
      type: object
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/TestDataSource"
        kinds:
          type: array
          maxItems: 20
          description: Which families of violation. Absent means every kind the schema supports.
          items:
            $ref: "#/components/schemas/InvalidDataKind"
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
        seed:
          type: integer
          format: int64
        locale:
          type: string
          maxLength: 20

    InvalidDataKind:
      type: string
      enum: [missing, empty, type, too_long, too_short, too_large, too_small, enum, format, pattern, injection, declined_card]

    TestDataSet:
      type: object
      required: [seed, records]
      properties:
        seed:
          type: integer
          format: int64
          description: The seed that produced this set. The same seed and count reproduce it exactly.
        records:
          type: array
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          description: Schemas the walk could not do much with, and what the AI pass did or did not fill.
          items:
            type: string

    InvalidTestDataRecord:
      type: object
      required: [field, kind, record]
      properties:
        field:
          type: string
        kind:
          $ref: "#/components/schemas/InvalidDataKind"
        violates:
          type: string
          description: The constraint this record breaks, in words.
        expectation:
          type: string
          description: What the endpoint should do about it. This is the assertion somebody writes from the record.
        record:
          type: object
          additionalProperties: true

    InvalidTestDataSet:
      type: object
      required: [seed, records]
      properties:
        seed:
          type: integer
          format: int64
        records:
          type: array
          items:
            $ref: "#/components/schemas/InvalidTestDataRecord"
        skipped:
          type: array
          description: >-
            Fields that produced no case, so an unconstrained field is distinguishable
            from one the generator ignored.
          items:
            type: string

    TestDataShape:
      type: object
      required: [endpoint, hasRequest]
      properties:
        endpoint:
          type: string
        summary:
          type: string
        hasRequest:
          type: boolean
        responses:
          type: array
          items:
            type: string
        fields:
          type: array
          items:
            type: string

    TestDataShapeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TestDataShape"

    Quarantine:
      type: object
      required: [id, projectId, testName, source, ageHours, stale, active, createdAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        testName:
          type: string
        testCaseId:
          type: string
          format: uuid
        reason:
          type: string
          description: The sentence a person reads, with the arithmetic that produced it.
        flakeCount:
          type: integer
        windowRuns:
          type: integer
        source:
          type: string
          enum: [auto, manual]
        ownerId:
          type: string
          format: uuid
          description: Who is answerable. Absent on an automatic quarantine nobody has claimed.
        ageHours:
          type: integer
          description: How long it has stood. A fortnight is a decision; a year is an abandonment.
        stale:
          type: boolean
          description: Older than the configured review age. Surfaced, never released automatically.
        active:
          type: boolean
        lastFlakedAt:
          type: string
          format: date-time
          nullable: true
        releasedAt:
          type: string
          format: date-time
          nullable: true
        releaseNote:
          type: string
        createdAt:
          type: string
          format: date-time

    QuarantineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Quarantine"

    QuarantineRequest:
      type: object
      required: [testName]
      properties:
        testName:
          type: string
          minLength: 1
          maxLength: 500
        reason:
          type: string
          maxLength: 2000

    QuarantineOwnerRequest:
      type: object
      required: [ownerId]
      properties:
        ownerId:
          type: string
          format: uuid

    QuarantineReleaseRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
          description: What changed, so the next person reading the history knows why it ended.

    Integration:
      type: object
      required: [capability, id, builtin, state]
      properties:
        capability:
          type: string
          description: The registry it belongs to — notifier, defecttracker, sourceprovider, runtrigger, objectstore.
        id:
          type: string
        builtin:
          type: boolean
          description: The always-on fallback each capability registers first.
        state:
          type: string
          enum: [builtin, active, not_configured]

    IntegrationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Integration"

    MCPTransport:
      type: string
      enum: [stdio, http]

    MCPScope:
      type: string
      enum: [global, project]

    MCPServerTool:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        write:
          type: boolean
          description: The tool changes state. Write tools are governed by the write-safety rules.

    MCPServerRequest:
      type: object
      required: [name, transport, scope]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        transport:
          $ref: "#/components/schemas/MCPTransport"
        command:
          type: string
          description: For stdio.
          maxLength: 500
        args:
          type: array
          items:
            type: string
        url:
          type: string
          description: For http.
          maxLength: 2048
        scope:
          $ref: "#/components/schemas/MCPScope"
        projectId:
          type: string
          format: uuid
          description: Required for a project-scoped server; the boundary that keeps it off other projects.
        credential:
          type: string
          description: A token or OAuth material. Encrypted at rest and never returned; omit on update to keep it.
        enabledTools:
          type: array
          description: The allowlist. Deny-all — a tool not here is refused. Update only; a new server starts empty.
          items:
            type: string
        autoWrite:
          type: boolean
          description: Permit writes without a per-call confirmation. Off by default.
        isEnabled:
          type: boolean

    MCPServer:
      type: object
      required: [id, name, transport, scope, enabledTools, isEnabled, healthStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        transport:
          $ref: "#/components/schemas/MCPTransport"
        command:
          type: string
        args:
          type: array
          items:
            type: string
        url:
          type: string
        scope:
          $ref: "#/components/schemas/MCPScope"
        projectId:
          type: string
          format: uuid
          nullable: true
        enabledTools:
          type: array
          items:
            type: string
        discoveredTools:
          type: array
          description: What the last connection test found, so the allowlist screen shows what is available.
          items:
            $ref: "#/components/schemas/MCPServerTool"
        autoWrite:
          type: boolean
        isEnabled:
          type: boolean
        hasCredential:
          type: boolean
        healthStatus:
          type: string
          enum: [unknown, healthy, unreachable]
        healthDetail:
          type: string
        healthCheckedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    MCPServerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MCPServer"

    MCPCall:
      type: object
      required: [id, tool, status, at]
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: string
          format: uuid
          nullable: true
        serverName:
          type: string
        tool:
          type: string
        arguments:
          type: object
          additionalProperties: true
          description: The call's arguments, with credential-shaped values redacted.
        status:
          type: string
          enum: [ok, error, denied]
        error:
          type: string
        agent:
          type: string
        projectId:
          type: string
          format: uuid
          nullable: true
        jobId:
          type: string
          format: uuid
          nullable: true
        at:
          type: string
          format: date-time

    MCPCallList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MCPCall"

    RunKind:
      type: string
      enum: [functional, performance, security]

    LoadProfile:
      type: object
      description: The authorised load. It says how hard to hit the target, and it is the caller's decision.
      required: [virtualUsers, holdSeconds]
      properties:
        virtualUsers:
          type: integer
          minimum: 1
          maximum: 10000
          description: Peak concurrency, reached at the end of the ramp.
        rampUpSeconds:
          type: integer
          minimum: 0
          default: 0
        holdSeconds:
          type: integer
          minimum: 1
          description: How long to sustain peak, which is where the steady-state percentiles come from.
        p95TargetMs:
          type: integer
          minimum: 1
          default: 500
          description: Becomes a k6 threshold, so the run has a stated pass condition.
        maxErrorRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.01

    StartPerformanceRequest:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/LoadProfile"
        targetUrl:
          type: string
          maxLength: 2048
          description: Override the project's configured target. Checked against the allowlist like any other.
        confirmHost:
          type: string
          maxLength: 255
          description: The exact host, to authorise the first run against a new one.

    PerformanceMetrics:
      type: object
      required: [runId, requests, throughput, errorRate]
      properties:
        runId:
          type: string
          format: uuid
        requests:
          type: integer
          format: int64
        throughput:
          type: number
          format: double
          description: Requests per second over the run.
        errorRate:
          type: number
          format: double
        latencyAvgMs:
          type: number
          format: double
        latencyP50Ms:
          type: number
          format: double
        latencyP90Ms:
          type: number
          format: double
        latencyP95Ms:
          type: number
          format: double
        latencyP99Ms:
          type: number
          format: double
        latencyMaxMs:
          type: number
          format: double
        virtualUsers:
          type: integer
        durationMs:
          type: integer
          format: int64

    StartSecurityScanRequest:
      type: object
      properties:
        categories:
          type: array
          maxItems: 7
          description: Which weakness classes to probe. Absent means all seven.
          items:
            type: string
            enum: [sqli, xss, csrf, jwt, idor, rate_limit, broken_auth]
        targetUrl:
          type: string
          maxLength: 2048
        confirmHost:
          type: string
          maxLength: 255

    SecurityFinding:
      type: object
      required: [id, runResultId, payloadId, category, endpoint, severity]
      properties:
        id:
          type: string
          format: uuid
        runResultId:
          type: string
          format: uuid
          description: The result row the probe produced, through which the finding is promoted to a defect.
        payloadId:
          type: string
          description: The reviewed library entry this came from. Always a real payload a person approved.
        category:
          type: string
        endpoint:
          type: string
        parameter:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        evidence:
          type: string
          description: What the detection rule matched — the reflection, the database error, the unexpected 2xx.
        reproduction:
          type: string
          description: A request a person can replay to confirm it, with the credential redacted.

    SecurityFindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecurityFinding"

    RunArtifactKind:
      type: string
      enum: [log, screenshot, video, trace]

    RunArtifact:
      type: object
      required: [resultId, testName, attempt, kind, downloadPath]
      properties:
        resultId:
          type: string
          format: uuid
        testName:
          type: string
        attempt:
          type: integer
          description: Which attempt produced it, so a flaky test's evidence is separable run by run.
        kind:
          $ref: "#/components/schemas/RunArtifactKind"
        contentType:
          type: string
        url:
          type: string
          description: >-
            A time-limited URL, when the configured storage can sign one. Absent
            otherwise, and downloadPath still works.
        downloadPath:
          type: string
          description: The platform path that streams this file.

    RunArtifactList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunArtifact"

    RunResultArtifacts:
      type: object
      description: What this result left behind. A key is present only when the run produced one.
      properties:
        hasLog:
          type: boolean
        hasScreenshot:
          type: boolean
        hasVideo:
          type: boolean
        hasTrace:
          type: boolean
          description: >-
            A Playwright trace, the step-by-step record of what the page did.

    RunResultPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunResult"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
        counts:
          type: object
          description: The whole run's tally by status, so a summary strip needs no second request.
          additionalProperties:
            type: integer

    RunCommand:
      type: object
      required: [id, command, at]
      properties:
        id:
          type: integer
          format: int64
        command:
          type: string
          description: Already redacted. A credential passed to the suite never appears here.
        exitCode:
          type: integer
          nullable: true
          description: Null while the command is still running.
        durationMs:
          type: integer
        outputExcerpt:
          type: string
        at:
          type: string
          format: date-time

    RunCommandList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunCommand"

    RunTrendPoint:
      type: object
      required: [runId, at, status, total, passed, failed, flaky, skipped, passRate]
      properties:
        runId:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/RunStatus"
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        flaky:
          type: integer
        skipped:
          type: integer
        durationMs:
          type: integer
        passRate:
          type: number
          format: double
          description: |
            Passed over executed, where executed excludes skipped tests and counts a
            flaky test as neither passed nor failed.

    RunTrend:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunTrendPoint"

    ProjectDashboard:
      type: object
      required: [requirements, testCases, approvedCases, testFiles, runs, passed, failed, flaky]
      properties:
        requirements:
          type: integer
        testCases:
          type: integer
        approvedCases:
          type: integer
        testFiles:
          type: integer
        runs:
          type: integer
        passed:
          type: integer
          description: |
            Tests passed in the most recent finished run, not a lifetime total: a
            dashboard answers where the project stands now.
        failed:
          type: integer
        flaky:
          type: integer

    CaseHistoryEntry:
      type: object
      required: [runId, status, attempt, at]
      properties:
        runId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RunResultStatus"
        durationMs:
          type: integer
        attempt:
          type: integer
        at:
          type: string
          format: date-time

    CaseHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CaseHistoryEntry"

    TestFilePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TestFile"
        nextCursor:
          $ref: "#/components/schemas/NextCursor"
        summary:
          type: array
          description: File and byte counts per framework, so a browser can show totals without paging.
          items:
            $ref: "#/components/schemas/TestFileSummary"

    TestFileSummary:
      type: object
      required: [framework, files, bytes]
      properties:
        framework:
          $ref: "#/components/schemas/TestFramework"
        files:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64

    TestFileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TestFile"

  responses:
    BadRequest:
      description: The request is structurally valid but not permitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_failed
            message: Email is not valid.
            details:
              field: email
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthenticated
            message: Sign in to continue.
    Forbidden:
      description: Authenticated, but not permitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: role_required
            message: This action requires the Admin role.
    NotFound:
      description: |
        Not found, or not visible to this caller. The two are deliberately
        indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: project_not_found
            message: Project not found.
    Conflict:
      description: The request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: project_archived
            message: This project is archived and is read-only. Unarchive it to make changes.
    TooManyRequests:
      description: Rate limited. Retry-After is set.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: rate_limited
            message: Too many requests. Wait a moment and try again.
            details:
              retryAfterSeconds: 30
    ServiceUnavailable:
      description: |
        A dependency is up but not answering usefully. The work is retried rather
        than lost, and the message says which dependency.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: service_degraded
            message: AI service is not reachable right now. The work will be retried.
    InternalError:
      description: |
        An unexpected failure. Carries an incident ID and nothing else; the cause
        is in the structured log against that ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
            message: Something went wrong on our side.
            incidentId: 9f2c1a7e
