# Local development stack.
#
# Postgres and Redis are the two genuine bootstrap dependencies
# (requirements.md 5.1). MinIO is here only so the optional object-store driver
# can be exercised locally: the built-in default is local disk and needs no
# configuration at all (requirements.md 5.4). Never make a test depend on MinIO
# being up.
#
# Ports are deliberately non-default so the stack coexists with a Postgres or
# Redis already installed on the developer's machine. .env.example matches.

name: qavia

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qavia
      POSTGRES_PASSWORD: qavia
      POSTGRES_DB: qavia
      # Deterministic collation so index behaviour matches CI.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qavia -d qavia"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: qavia
      MINIO_ROOT_PASSWORD: qaviaqavia
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
